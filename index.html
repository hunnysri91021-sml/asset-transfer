<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบโอนย้ายทรัพย์สิน — SML</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#1a3c6e; --navy-dark:#122a4d; --navy-light:#eaf0f8;
    --gold:#b8892f; --green:#1a7d3c; --red:#c0392b; --amber:#b8860b;
    --bg:#f4f6f9; --card:#ffffff; --border:#dde3ec; --text:#22303f; --muted:#697586;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);margin:0;}

  /* ===== APP SHELL / SIDEBAR LAYOUT ===== */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:99;}
  .sidebar-backdrop.open{display:block;}
  .sidebar{width:230px;flex:0 0 230px;background:var(--navy-dark);color:#fff;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:transform .2s ease;}
  .sidebar-brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .sidebar-brand h1{font-size:15px;margin:0;font-weight:700;line-height:1.35;}
  .sidebar-brand .sub{font-size:11px;opacity:.65;margin-top:5px;font-weight:300;line-height:1.4;}
  .sidebar-nav{padding:10px 0 24px;}
  .sidebar-nav .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.42);padding:16px 18px 6px;}
  .sidebar-nav button{display:block;width:100%;background:none;border:none;border-right:3px solid transparent;color:rgba(255,255,255,.82);padding:10px 18px;text-align:left;cursor:pointer;font-family:inherit;font-size:13.5px;transition:.15s;}
  .sidebar-nav button:hover{background:rgba(255,255,255,.08);}
  .sidebar-nav button.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;border-right-color:var(--gold);}
  .main-area{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0;}
  .topheader{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
  .topheader .page-title{font-size:16px;font-weight:600;color:var(--navy);}
  .sidebar-toggle{display:none;background:none;border:1px solid var(--border);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:16px;line-height:1;color:var(--navy);}
  .content{padding:20px 24px;max-width:1240px;width:100%;margin:0 auto;}
  @media (max-width: 880px){
    .sidebar{transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.25);}
    .sidebar.open{transform:translateX(0);}
    .main-area{margin-left:0;}
    .sidebar-toggle{display:inline-block;}
  }
  @media print{
    .sidebar, .topheader, .sidebar-backdrop{display:none !important;}
    .main-area{margin-left:0;}
  }

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy-dark),var(--navy));}
  .login-card{max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .login-card h1{margin:0 0 4px;font-size:20px;color:var(--navy);text-align:center;}
  .login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:#fff;border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .modal-box h2{margin-top:0;font-size:16px;color:var(--navy);border-bottom:2px solid var(--navy-light);padding-bottom:10px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,50,.05);}
  .card h2{margin-top:0;font-size:16px;color:var(--navy);border-bottom:2px solid var(--navy-light);padding-bottom:10px;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500;}
  input[type=text], input[type=date], input[type=email], input[type=password], select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:#fff;
  }
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:200px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-secondary{background:#eef1f6;color:var(--text);}
  .btn-secondary:hover{background:#e0e5ec;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:middle;}
  th{background:var(--navy-light);color:var(--navy);font-weight:600;}
  tbody tr:hover td{background:#f5f8fc;}
  .money{text-align:right;font-variant-numeric:tabular-nums;}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee;cursor:zoom-in;}
  .thumb-lg{width:100px;height:100px;object-fit:cover;border-radius:8px;background:#eee;border:1px solid var(--border);}
  .thumb-sm{width:30px;height:30px;}
  .asset-table{table-layout:fixed;width:100%;font-size:11.5px;}
  .asset-table th,.asset-table td{padding:4px 5px;word-wrap:break-word;overflow-wrap:break-word;}
  .asset-table .btn-sm{padding:3px 6px;font-size:10.5px;margin:1px;}
  .asset-table select{font-size:11.5px;padding:3px 4px;}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;}
  .lightbox-img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5);cursor:default;}
  .lightbox-close{position:absolute;top:20px;right:24px;background:rgba(255,255,255,0.15);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge-pending{background:#fff3cd;color:var(--amber);}
  .badge-approved{background:#d4edda;color:var(--green);}
  .badge-rejected{background:#f8d7da;color:var(--red);}
  .badge-draft{background:#e2e3e5;color:#555;}
  .stat-tile{background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:14px 16px;flex:1;min-width:160px;}
  .stat-tile .num{font-size:26px;font-weight:700;color:var(--navy);}
  .stat-tile .label{font-size:13px;color:var(--muted);}
  .stat-tile .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:240px;overflow:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .autocomplete-item{padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;}
  .autocomplete-item:hover{background:var(--navy-light);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy-dark);color:#fff;padding:12px 20px;border-radius:8px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .toast.err{background:var(--red);}
  .toast.ok{background:var(--green);}
  .empty{text-align:center;color:var(--muted);padding:40px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .item-line{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafbfc;position:relative;}
  .item-line .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;}
  .file-drop{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;}
  .file-drop:hover{border-color:var(--navy);}

  /* ===== PRINT / DOCUMENT LAYOUT (matches original ใบโอนย้ายทรัพย์สิน template) ===== */
  .doc{background:#fff;padding:28px 34px;font-size:14px;line-height:1.6;}
  .doc .doc-header{text-align:center;font-weight:700;font-size:18px;margin-bottom:2px;}
  .doc .doc-title{text-align:center;font-weight:700;font-size:17px;margin:10px 0 16px;text-decoration:underline;}
  .doc .doc-meta{display:flex;justify-content:flex-end;gap:24px;font-size:13px;margin-bottom:10px;}
  .doc .doc-field{margin:4px 0;font-size:13.5px;}
  .doc .doc-field b{display:inline-block;min-width:70px;}
  .doc table.doc-table{margin-top:14px;font-size:12.5px;table-layout:fixed;}
  .doc table.doc-table th{background:var(--navy-light);text-align:center;}
  .doc table.doc-table td{text-align:center;word-wrap:break-word;overflow-wrap:break-word;vertical-align:middle;}
  .doc table.doc-table td.left{text-align:left;}
  .doc-img-gallery{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}
  .doc-img-gallery img{width:26px;height:26px;object-fit:cover;border-radius:3px;border:1px solid #ddd;}
  .item-img-gallery{display:flex;flex-wrap:wrap;gap:6px;}
  .item-img-gallery .item-img-thumb{position:relative;width:60px;height:60px;}
  .item-img-gallery .item-img-thumb img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
  .item-img-gallery .item-img-thumb .del-img{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;line-height:18px;text-align:center;cursor:pointer;padding:0;}
  .item-img-add{width:60px;height:60px;border:1px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer;text-align:center;}
  .doc .doc-note{font-size:11.5px;color:#555;margin-top:16px;border-top:1px dashed #ccc;padding-top:10px;}
  .doc .doc-sign{display:flex;justify-content:space-between;margin-top:30px;font-size:13px;}
  .doc .doc-sign div{width:45%;text-align:center;}
  .doc .doc-sign .line{border-bottom:1px dotted #333;height:40px;}
  .doc .dateline{display:inline-block;width:110px;border-bottom:1px dotted #333;height:13px;vertical-align:top;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
    * {-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important;}
    .doc-table{border-collapse:collapse !important;}
    .doc-table tr{page-break-inside:avoid;break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop no-print" id="sidebarBackdrop"></div>
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-brand">
      <h1>ระบบจัดการทรัพย์สิน</h1>
      <div class="sub">บริษัท สยามกลการโลจิสติกส์ จำกัด</div>
      <div style="margin-top:6px;font-size:11px;display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.7);">
        <span id="onlineDot" style="width:8px;height:8px;border-radius:50%;background:#9aa5b1;display:inline-block;flex:0 0 auto;"></span>
        <span id="onlineText">กำลังเชื่อมต่อ...</span>
      </div>
    </div>
    <nav id="mainNav" class="sidebar-nav">
      <div class="nav-group-label">ภาพรวม</div>
      <button data-view="dashboard">ข้อมูลรวม</button>
      <button data-view="assetList">รายการทรัพย์สิน</button>
      <button data-view="auction">ประมูลขาย</button>
      <div class="nav-group-label">โอนย้าย</div>
      <button data-view="list">รายการใบโอนย้าย</button>
      <button data-view="create">+ สร้างใบโอนย้าย</button>
      <div class="nav-group-label">ขายออก</div>
      <button data-view="saleList">รายการขายออก</button>
      <button data-view="saleCreate">+ บันทึกขายออก</button>
      <div class="nav-group-label">ตัดชำรุด</div>
      <button data-view="writeOffList">รายการตัดชำรุด</button>
      <button data-view="writeOffCreate">+ บันทึกตัดชำรุด</button>
      <div class="nav-group-label" id="navGroupSystem">ระบบ</div>
      <button data-view="activityLog" id="navActivityLog">ประวัติการใช้งาน</button>
      <button data-view="settings">ตั้งค่า</button>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topheader no-print">
      <button class="sidebar-toggle" id="btnSidebarToggle">☰</button>
      <span class="page-title" id="pageTitle">ข้อมูลรวม</span>
      <span id="roleBadge" style="margin-left:auto;font-size:12px;color:var(--muted);"></span>
      <button class="btn btn-secondary btn-sm" id="btnLogout">ออกจากระบบ</button>
    </header>
    <div id="viewRoot" class="content"></div>
  </div>
</div>
<div id="toastHost"></div>
<div id="modalHost"></div>

<script>
/* ================= CONFIG ================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyiAvjkIoyvuWJ8eCyMho01tENIUR--1HjMEzOigVQn-IVevZido9dXKcmUSdPbXQjIxw/exec';
const COMPANY_NAME = '    บริษัท   สยามกลการโลจิสติกส์   จำกัด';

/* ================= STATE ================= */
let STATE = {
  view: 'dashboard',
  role: null,
  username: null,
  assets: [],
  deptCodes: [],
  transfers: [],
  transferQueue: [],
  selectedQueueAssetIds: [],
  currentTransfer: null,
  draftItems: [],
  createStep: 'form',
  transferHeader: null,
  approveCtx: null,
  adminPassword: null,
  sales: [],
  saleQueue: [],
  selectedSaleQueueAssetIds: [],
  draftSaleItems: [],
  saleCreateStep: 'form',
  saleHeader: null,
  printSaleId: null,
  approveSaleCtx: null,
  assetsFull: [],
  selectedAssetIds: [],
  writeOffs: [],
  writeOffQueue: [],
  selectedWriteOffQueueAssetIds: [],
  draftWriteOffItems: [],
  writeOffCreateStep: 'form',
  writeOffHeader: null,
  printWriteOffId: null,
  approveWriteOffCtx: null,
  myDepartments: [],
  canViewPrices: false,
  assetListTab: 'all'
};

/* ================= API HELPERS ================= */
function apiGet(params){
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  return fetch(url, { method:'GET' })
    .then(r => r.json())
    .catch(err => ({ ok:false, error:'เชื่อมต่อ GAS ไม่สำเร็จ: '+err }));
}
function apiPost(payload){
  return fetch(GAS_URL, {
    method:'POST',
    body: JSON.stringify(payload) // text/plain by default -> avoids CORS preflight on GAS
  }).then(r => r.json())
    .catch(err => ({ ok:false, error:'เชื่อมต่อ GAS ไม่สำเร็จ: '+err }));
}

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.getElementById('toastHost').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function fmtMoney(n){
  n = parseFloat(String(n).replace(/,/g,'')) || 0;
  return n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
// ราคาซาก/มูลค่าตามบัญชี ซ่อนได้เป็นรายคนตามสิทธิ์ที่ Admin กำหนด (STATE.canViewPrices) — Admin/ผู้บริหารเห็นเสมอ
function canSeePrice(){ return STATE.role==='admin' || STATE.role==='executive' || !!STATE.canViewPrices; }
function fmtMoneyOrHidden(n){ return canSeePrice() ? fmtMoney(n) : '••••••'; }
// เห็นข้อมูลทุกหน่วยงานแบบเดียวกับ Admin ได้ไหม (ใช้กรองรายการโอนย้าย/ขาย/ตัดชำรุด + กำหนดขอบเขตการดูข้อมูลอื่นๆ)
function canViewAllDepts(){ return STATE.role==='admin' || STATE.role==='executive'; }
// รายการโอนย้าย/ขาย/ตัดชำรุด — ผู้ใช้ทั่วไปเห็นเฉพาะหน่วยงานของตนเอง (STATE.myDepartments), Admin/ผู้บริหารเห็นทั้งหมด
function deptFilterRows(rows, fields){
  if(canViewAllDepts()) return rows;
  const mine = STATE.myDepartments || [];
  return rows.filter(r => fields.some(f => mine.indexOf(r[f]) !== -1));
}
// ผู้บริหาร: ดูข้อมูลได้ทุกหน่วยงานเหมือน Admin แต่สร้าง/แก้ไข/ลบ/อนุมัติไม่ได้เลย (ซ่อนปุ่ม/หน้าจัดการทั้งหมด)
function isViewOnly(){ return STATE.role === 'executive'; }
// ให้คลิกได้ทั้งแถวเพื่อติ๊ก/ถอนติ๊ก checkbox เลือกแถว ไม่ต้องเล็งที่กล่องเล็กๆ — ยกเว้นคลิกโดนปุ่ม/select/รูปภาพ
// ในแถวเอง (ให้ทำงานตามปกติของมันแทน ไม่แย่งชิงคลิก) และแถวที่ checkbox ถูก disabled ไว้
function makeRowsClickable(host, checkboxClass){
  host.querySelectorAll('tr').forEach(tr=>{
    const chk = tr.querySelector('.'+checkboxClass);
    if(!chk || chk.disabled) return;
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('input,button,select,a,img')) return;
      chk.checked = !chk.checked;
      chk.dispatchEvent(new Event('change', {bubbles:true}));
    });
  });
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  const buddhistYear = dt.getFullYear()+543;
  return ('0'+dt.getDate()).slice(-2)+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+buddhistYear;
}
const STATUS_LABELS = {
  Draft: 'ฉบับร่าง',
  PendingApproval: 'รออนุมัติ',
  Approved: 'อนุมัติแล้ว',
  Rejected: 'ไม่อนุมัติ',
  Voided: 'ยกเลิกแล้ว'
};
function statusBadge(s){
  const cls = { Draft:'draft', PendingApproval:'pending', Approved:'approved', Rejected:'rejected', Voided:'draft' };
  return '<span class="badge badge-'+(cls[s]||'draft')+'">'+(STATUS_LABELS[s]||s)+'</span>';
}
// เหมือน statusBadge แต่สถานะ Approved ของใบขายออกให้อ่านว่า "ขายแล้ว" แทน "อนุมัติแล้ว" เพื่อให้ตรงกับสถานะทรัพย์สินจริง
function saleStatusBadge(s){
  const cls = { Draft:'draft', PendingApproval:'pending', Approved:'approved', Rejected:'rejected', Voided:'draft' };
  const label = s === 'Approved' ? 'ขายแล้ว' : (STATUS_LABELS[s]||s);
  return '<span class="badge badge-'+(cls[s]||'draft')+'">'+label+'</span>';
}
function deptSkipsApproval(deptName){
  const d = STATE.deptCodes.find(x=>x.DeptName===deptName);
  return !!(d && d.SkipApprovalEmail);
}
function assetStatusBadge(s){
  const map = {
    Active: ['approved','ใช้งาน'],
    Sold: ['rejected','ขายแล้ว'],
    WrittenOff: ['draft','ตัดชำรุด']
  };
  const v = map[s] || ['approved', 'ใช้งาน'];
  return '<span class="badge badge-'+v[0]+'">'+v[1]+'</span>';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ================= EXCEL EXPORT ================= */
// sheetDefs: [{ name, header:[...], rows:[[...], ...] }, ...]
function exportExcel(filename, sheetDefs){
  if(typeof XLSX === 'undefined'){ toast('โหลดไลบรารี Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่','err'); return; }
  const wb = XLSX.utils.book_new();
  sheetDefs.forEach(def=>{
    const ws = XLSX.utils.aoa_to_sheet([def.header, ...def.rows]);
    XLSX.utils.book_append_sheet(wb, ws, String(def.name).substring(0,31));
  });
  XLSX.writeFile(wb, filename);
}

/* ================= AUTH (login gate: User / Admin, shared password) ================= */
const AUTH_SESSION_KEY = 'assetTransferAuthSession';

function checkAuth(){
  const saved = sessionStorage.getItem(AUTH_SESSION_KEY);
  if(!saved) return false;
  try{
    const obj = JSON.parse(saved);
    if(obj && obj.password && obj.role){
      STATE.adminPassword = obj.password;
      STATE.role = obj.role;
      STATE.username = obj.username || '';
      STATE.myDepartments = obj.departments || [];
      STATE.canViewPrices = !!obj.canViewPrices;
      return true;
    }
  }catch(e){}
  return false;
}

function renderLogin(){
  hideAppChrome();
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="login-wrap">
      <div class="card login-card">
        <h1>ระบบจัดการทรัพย์สิน</h1>
        <div class="sub">บริษัท สยามกลการโลจิสติกส์ จำกัด</div>
        <label>ชื่อผู้ใช้</label>
        <input type="text" id="loginUsername" placeholder="กรอกชื่อผู้ใช้" autocomplete="username">
        <label>รหัสผ่าน</label>
        <input type="password" id="loginPw" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
        <div style="margin-top:16px;">
          <button class="btn btn-primary" id="btnLogin" style="width:100%;">เข้าสู่ระบบ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginUsername').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('btnLogin').onclick = doLogin;

  function doLogin(){
    const username = document.getElementById('loginUsername').value.trim();
    const pw = document.getElementById('loginPw').value;
    if(!username || !pw){ toast('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน','err'); return; }
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    apiPost({ action:'login', username, password: pw }).then(res=>{
      btn.disabled = false;
      if(!res.ok){ toast(res.error||'เข้าสู่ระบบไม่สำเร็จ','err'); return; }
      STATE.adminPassword = pw;
      STATE.role = res.data.role;
      STATE.username = res.data.username;
      STATE.myDepartments = res.data.departments || [];
      STATE.canViewPrices = !!res.data.canViewPrices;
      sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ password: pw, role: res.data.role, username: res.data.username, departments: res.data.departments || [], canViewPrices: !!res.data.canViewPrices }));
      STATE.view = 'dashboard';
      enterApp();
    });
  }
}

function logout(){
  stopHeartbeat();
  sessionStorage.removeItem(AUTH_SESSION_KEY);
  STATE.adminPassword = null;
  STATE.role = null;
  STATE.username = null;
  STATE.myDepartments = [];
  STATE.canViewPrices = false;
  STATE.view = 'dashboard';
  enterApp();
}

function enterApp(){
  const params = new URLSearchParams(location.search);
  const av = params.get('view');
  if(av==='approve' || av==='approveSale' || av==='approveWriteOff'){ route(); return; }
  if(checkAuth()){ startHeartbeat(); route(); } else { stopHeartbeat(); renderLogin(); }
}

/* ================= HEARTBEAT / สถานะออนไลน์ ================= */
// ยิง action 'heartbeat' เป็นระยะเพื่อ (1) ปักหมุดผู้ใช้นี้ว่า "ออนไลน์" ให้ Admin เห็นในหน้าตั้งค่า
// และ (2) ใช้ผลสำเร็จ/ไม่สำเร็จของ request นี้เองมาบอกสถานะ "ระบบออนไลน์อยู่" ที่แถบเมนูด้านซ้าย
let heartbeatIntervalId = null;
const HEARTBEAT_INTERVAL_MS = 45000;

function startHeartbeat(){
  stopHeartbeat();
  sendHeartbeat();
  heartbeatIntervalId = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);
}
function stopHeartbeat(){
  if(heartbeatIntervalId){ clearInterval(heartbeatIntervalId); heartbeatIntervalId = null; }
}
function sendHeartbeat(){
  apiPost({ action:'heartbeat', password: STATE.adminPassword }).then(res=>{
    setOnlineStatus(!!(res && res.ok));
  });
}
function setOnlineStatus(isOnline){
  const dot = document.getElementById('onlineDot');
  const text = document.getElementById('onlineText');
  if(!dot || !text) return;
  if(isOnline){
    dot.style.background = '#2ecc71';
    text.textContent = 'ระบบออนไลน์';
  } else {
    dot.style.background = '#e74c3c';
    text.textContent = 'ขาดการเชื่อมต่อ';
  }
}

/* ================= ROUTER ================= */
function route(){
  const params = new URLSearchParams(location.search);
  if(params.get('view') === 'approve'){
    STATE.view = 'approve';
    STATE.approveCtx = { id: params.get('id'), token: params.get('token') };
    renderApprove();
    return;
  }
  if(params.get('view') === 'approveSale'){
    STATE.view = 'approveSale';
    STATE.approveSaleCtx = { id: params.get('id'), token: params.get('token') };
    renderApproveSale();
    return;
  }
  if(params.get('view') === 'approveWriteOff'){
    STATE.view = 'approveWriteOff';
    STATE.approveWriteOffCtx = { id: params.get('id'), token: params.get('token') };
    renderApproveWriteOff();
    return;
  }
  render();
}

        <select id="alDivision" autocomplete="off" style="max-width:160px;"><option value="">ทุกฝ่าย</option></select>
        <select id="alWorkGroup" autocomplete="off" style="max-width:160px;"><option value="">ทุกกลุ่มงาน</option></select>
        <select id="alLocation" autocomplete="off" style="max-width:160px;"><option value="">ทุกสถานที่</option></select>
        <button class="btn btn-secondary btn-sm" id="btnAlFilter">กรอง</button>
        <button class="btn btn-secondary btn-sm" id="btnAlRefresh">↻ รีเฟรช</button>
        <button class="btn btn-secondary btn-sm" id="btnAlExport" style="margin-left:auto;">⬇ Export Excel</button>
      </div>
      ${manageMode ? `
      <div class="toolbar no-print" style="border-top:1px solid var(--border);padding-top:10px;">
        <span id="alTotalCount" style="font-size:13px;color:var(--muted);">รวม 0 รายการ</span>
        <span id="alSelCount" style="font-size:13px;color:var(--muted);">เลือกไว้ 0 รายการ</span>
        <button class="btn btn-primary btn-sm" id="btnAlTransfer">สร้างใบโอนย้าย</button>
        <button class="btn btn-primary btn-sm" id="btnAlSale">สร้างใบขาย</button>
        <button class="btn btn-primary btn-sm" id="btnAlWriteOff">สร้างใบตัดชำรุด</button>
        <button class="btn btn-secondary btn-sm" id="btnAlRestore">คืนสถานะใช้งาน (Admin)</button>
        <button class="btn btn-secondary btn-sm" id="btnAlAddNew" style="margin-left:auto;">+ เพิ่มทรัพย์สินใหม่</button>
      </div>
      <div id="alStatusAlert" class="no-print" style="display:none;background:#f8d7da;color:#c0392b;border:1px solid #f1b0b7;border-radius:6px;padding:8px 12px;font-size:13px;margin-top:8px;">⚠ รายการที่เลือกมีสถานะทรัพย์สินมากกว่า 1 สถานะ กรุณาเลือกเฉพาะทรัพย์สินที่มีสถานะเดียวกัน</div>` : ''}
      <div id="alTableHost" style="margin-top:12px;">${noDeptsAssigned ? '<div class="empty">คุณยังไม่ได้รับสิทธิ์ดูแลหน่วยงานใด กรุณาติดต่อ Admin ให้กำหนดหน่วยงานที่ดูแลในแถบ "ตั้งค่า"</div>' : '<div class="empty">กำลังโหลด...</div>'}</div>
    </div>
  `;

  document.getElementById('btnAlTabAll').onclick = ()=>{ STATE.assetListTab = 'all'; render(); };
  const btnAlTabManageEl = document.getElementById('btnAlTabManage');
  if(btnAlTabManageEl) btnAlTabManageEl.onclick = ()=>{ STATE.assetListTab = 'manage'; render(); };
  document.getElementById('btnAlFilter').onclick = load;
  document.getElementById('btnAlRefresh').onclick = load;
  document.getElementById('alStatus').onchange = renderTable;
  document.getElementById('alDivision').onchange = (e)=>{ selectedDivision = e.target.value; renderTable(); };
  document.getElementById('alWorkGroup').onchange = (e)=>{ selectedWorkGroup = e.target.value; renderTable(); };
  document.getElementById('alLocation').onchange = (e)=>{ selectedLocation = e.target.value; renderTable(); };
  document.getElementById('btnAlExport').onclick = exportAssetList;
  if(manageMode){
    document.getElementById('btnAlTransfer').onclick = ()=> startFromSelection('create');
    document.getElementById('btnAlSale').onclick = ()=> startFromSelection('saleCreate');
    document.getElementById('btnAlWriteOff').onclick = ()=> startFromSelection('writeOffCreate');
    document.getElementById('btnAlRestore').onclick = restoreSelected;
    document.getElementById('btnAlAddNew').onclick = ()=> openAssetEditModal(null, load);
  }

  function exportAssetList(){
    const rows = filteredRows();
    if(!rows.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const statusLabel = { Active:'ใช้งาน', Sold:'ขายแล้ว', WrittenOff:'ตัดชำรุด' };
    const queuePurposeLabel = { transfer:'รอโอนย้าย', sale:'รอขาย', writeoff:'รอตัดชำรุด' };
    const queueStatusOf = a => (STATE.assetQueuedPurposes[a.AssetID]||[]).map(p=>queuePurposeLabel[p]||p).join('/');
    const header = ['รหัส','ชื่อทรัพย์สิน','หน่วยงาน','ฝ่าย','กลุ่มงาน','ผู้ดูแล','สถานที่','ราคาซื้อ','มูลค่าตามบัญชี','ราคาซาก','สถานะ','แท็กสถานะ','สถานะการจัดการ (คิวรอ)','ลิงก์รูปภาพ'];
    const dataRows = rows.map(a => [a.AssetID, a.AssetName, a.Department, a.Division||'', a.WorkGroup||'', a.Custodian||'', a.Location||'', Number(a.PurchasePrice)||0, Number(a.BookValue)||0, Number(a.ScrapPrice)||0, statusLabel[a.AssetStatus]||'ใช้งาน', a.Tag||'ใช้งาน', queueStatusOf(a), a.DisplayImage||'']);
    exportExcel('รายการทรัพย์สิน.xlsx', [{ name:'รายการทรัพย์สิน', header, rows: dataRows }]);
  }

  if(!noDeptsAssigned) load();

  function load(){
    const q = document.getElementById('alSearch').value.trim();
    const params = { action:'getAssetListBundle' };
    if(q) params.q = q;
    document.getElementById('alTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet(params).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.assetsFull = res.data.assets;
      STATE.selectedAssetIds = [];
      STATE.assetQueuedPurposes = {};
      const mark = (list, purpose)=>{
        (list||[]).forEach(q=>{
          if(!STATE.assetQueuedPurposes[q.AssetID]) STATE.assetQueuedPurposes[q.AssetID] = [];
          STATE.assetQueuedPurposes[q.AssetID].push(purpose);
        });
      };
      mark(res.data.transferQueue, 'transfer');
      mark(res.data.saleQueue, 'sale');
      mark(res.data.writeOffQueue, 'writeoff');
      populateDeptFilterOptions();
      renderTable();
    });
  }

  function populateDeptFilterOptions(){
    const divSel = document.getElementById('alDivision');
    const wgSel = document.getElementById('alWorkGroup');
    const locSel = document.getElementById('alLocation');
    const scope = manageMode ? deptScopedRows(STATE.assetsFull) : STATE.assetsFull;
    const divisions = [...new Set(scope.map(a=>a.Division).filter(Boolean))].sort();
    const workGroups = [...new Set(scope.map(a=>a.WorkGroup).filter(Boolean))].sort();
    const locations = [...new Set(scope.map(a=>a.Location).filter(Boolean))].sort();
    divSel.innerHTML = '<option value="">ทุกฝ่าย</option>' + divisions.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
    wgSel.innerHTML = '<option value="">ทุกกลุ่มงาน</option>' + workGroups.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
    locSel.innerHTML = '<option value="">ทุกสถานที่</option>' + locations.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    if(divisions.indexOf(selectedDivision)===-1) selectedDivision = '';
    if(workGroups.indexOf(selectedWorkGroup)===-1) selectedWorkGroup = '';
    if(locations.indexOf(selectedLocation)===-1) selectedLocation = '';
    divSel.value = selectedDivision;
    wgSel.value = selectedWorkGroup;
    locSel.value = selectedLocation;
  }

  function deptScopedRows(rows){
    if(isAdmin) return rows;
    return rows.filter(a => (STATE.myDepartments||[]).indexOf(a.Department) !== -1);
  }

  function filteredRows(){
    const statusFilter = document.getElementById('alStatus').value;
    let rows = manageMode ? deptScopedRows(STATE.assetsFull) : STATE.assetsFull;
    if(statusFilter) rows = rows.filter(a => (a.AssetStatus||'Active') === statusFilter);
    if(selectedDivision) rows = rows.filter(a => a.Division === selectedDivision);
    if(selectedWorkGroup) rows = rows.filter(a => a.WorkGroup === selectedWorkGroup);
    if(selectedLocation) rows = rows.filter(a => a.Location === selectedLocation);
    return rows;
  }

  function renderTable(){
    const host = document.getElementById('alTableHost');
    const rows = filteredRows();
    if(manageMode){
      const totalEl = document.getElementById('alTotalCount');
      if(totalEl) totalEl.textContent = 'รวม '+rows.length+' รายการ';
    }
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่พบทรัพย์สิน</div>'; if(manageMode) updateSelCount(); return; }
    const allSelected = manageMode && rows.every(a=>STATE.selectedAssetIds.indexOf(a.AssetID)!==-1);
    let html = '<table class="asset-table"><tr>'
      + (manageMode ? `<th class="no-print" style="width:3%;"><input type="checkbox" id="alSelectAll" ${allSelected?'checked':''}></th>` : '')
      + `<th style="width:6%;">รูป</th><th style="width:8%;">รหัส</th><th style="width:${manageMode?'12':'15'}%;">ชื่อทรัพย์สิน</th>`
      + '<th style="width:8%;">หน่วยงาน</th><th style="width:7%;">ฝ่าย</th><th style="width:7%;">กลุ่มงาน</th><th style="width:8%;">ผู้ดูแล</th><th style="width:8%;">สถานที่</th>'
      + '<th style="width:8%;">ราคาซื้อ</th><th style="width:8%;">มูลค่าตามบัญชี</th><th style="width:6%;">สถานะ</th><th style="width:8%;">แท็กสถานะ</th>'
      + (manageMode ? '<th class="no-print" style="width:10%;">จัดการ</th><th class="no-print" style="width:5%;">ลบ</th>' : '')
      + '</tr>';
    rows.forEach(a=>{
      const checked = STATE.selectedAssetIds.indexOf(a.AssetID)!==-1 ? 'checked' : '';
      const curTag = a.Tag || 'ใช้งาน';
      html += `<tr>
        ${manageMode ? `<td class="no-print"><input type="checkbox" class="alRowChk" data-id="${esc(a.AssetID)}" ${checked}></td>` : ''}
        <td><img class="thumb thumb-sm" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(a.DisplayImage||'')}')"></td>
        <td><b>${esc(a.AssetID)}</b></td>
        <td>${esc(a.AssetName)}${syncFlagBadge(a)}</td>
        <td>${esc(a.Department)}</td>
        <td>${esc(a.Division||'-')}</td>
        <td>${esc(a.WorkGroup||'-')}</td>
        <td>${esc(a.Custodian||'-')}</td>
        <td>${esc(a.Location||'-')}</td>
        <td class="money">${fmtMoney(a.PurchasePrice)}</td>
        <td class="money">${fmtMoneyOrHidden(a.BookValue)}</td>
        <td>${assetStatusBadge(a.AssetStatus)}</td>
        ${manageMode
          ? `<td class="no-print"><select class="alTagSelect" data-id="${esc(a.AssetID)}" style="width:100%;">${ASSET_TAGS.map(t=>`<option value="${esc(t)}" ${curTag===t?'selected':''}>${esc(t)}</option>`).join('')}</select></td>`
          : `<td>${esc(curTag)}</td>`}
        ${manageMode ? `<td class="no-print" style="white-space:normal;">
          <button class="btn btn-secondary btn-sm" data-editid="${esc(a.AssetID)}">แก้ไข</button>
          ${(a.AssetStatus||'Active')==='Active' ? (()=>{
            const queued = STATE.assetQueuedPurposes[a.AssetID] || [];
            // ปกติทรัพย์สิน 1 ชิ้นควรอยู่ในคิวรอได้แค่ประเภทเดียว (บังคับฝั่ง backend แล้ว) — ถ้าเจอว่าติดค้าง
            // อยู่มากกว่า 1 คิวพร้อมกัน (ข้อมูลเก่าก่อนมีการบังคับ หรือกรณีผิดปกติ) ให้เตือนสีแดงชัดเจน พร้อมปุ่มล้างคิวซ้ำ
            if(queued.length > 1){
              const purposeLabels = { transfer:'โอนย้าย', sale:'ขาย', writeoff:'ตัดชำรุด' };
              return `<span class="badge badge-rejected">⚠ ค้างคิวซ้ำ: ${queued.map(p=>purposeLabels[p]||p).join('/')}</span> `
                + `<button class="btn btn-red btn-sm" data-clearqueueid="${esc(a.AssetID)}">ล้างคิวซ้ำ</button>`;
            }
            // เลือกได้เพียงคิวเดียวต่อทรัพย์สิน — ถ้าอยู่ในคิวประเภทอื่นแล้ว ไม่แสดงปุ่มเพิ่มคิวประเภทอื่นให้เลือกซ้ำ
            const btn = (purpose, label, queuedLabel) => {
              if (queued.indexOf(purpose)!==-1) return `<span class="badge badge-pending">${queuedLabel}</span>`;
              if (queued.length) return '';
              return `<button class="btn btn-secondary btn-sm" data-queueid="${esc(a.AssetID)}" data-queuepurpose="${purpose}">${label}</button>`;
            };
            return btn('transfer','+ คิวโอนย้าย','⏳ รอโอนย้าย')
              + btn('sale','+ คิวขาย','⏳ รอขาย')
              + btn('writeoff','+ คิวตัดชำรุด','⏳ รอตัดชำรุด');
          })() : ''}
        </td>
        <td class="no-print" style="text-align:center;"><button class="btn btn-red btn-sm" data-delid="${esc(a.AssetID)}">ลบ</button></td>` : ''}
      </tr>`;
    });
    html += '</table>';
    host.innerHTML = html;

    if(!manageMode) return;

    host.querySelectorAll('[data-editid]').forEach(btn=>{
      btn.onclick = ()=>{
        const asset = STATE.assetsFull.find(x=>x.AssetID===btn.dataset.editid);
        openAssetEditModal(asset, load);
      };
    });
    const QUEUE_PURPOSE_INFO = {
      transfer: { action:'addToTransferQueue', label:'โอนย้าย', tab:'รายการใบโอนย้าย' },
      sale: { action:'addToSaleQueue', label:'ขาย', tab:'รายการขายออก' },
      writeoff: { action:'addToWriteOffQueue', label:'ตัดชำรุด', tab:'รายการตัดชำรุด' }
    };
    host.querySelectorAll('[data-queueid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.queueid;
        const info = QUEUE_PURPOSE_INFO[btn.dataset.queuepurpose];
        btn.disabled = true;
        apiPost({ action: info.action, assetId, addedBy: STATE.username||'' }).then(res=>{
          btn.disabled = false;
          if(!res.ok){ toast(res.error||'เพิ่มเข้าคิวไม่สำเร็จ','err'); return; }
          toast(res.data.alreadyQueued ? ('ทรัพย์สินนี้อยู่ในคิวรอ'+info.label+'อยู่แล้ว') : ('เพิ่มเข้าคิวรอ'+info.label+'สำเร็จ — ดูได้ที่แถบ "'+info.tab+'"'),'ok');
        });
      };
    });
    host.querySelectorAll('[data-clearqueueid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.clearqueueid;
        if(!confirm('ล้างคิวรอที่ค้างซ้ำทั้งหมดของทรัพย์สิน '+assetId+' ? (ทรัพย์สินจะออกจากคิวรอทุกประเภท เลือกเข้าคิวใหม่ได้อีกครั้ง)')) return;
        apiPost({ action:'adminClearAssetQueues', password: STATE.adminPassword, assetId }).then(res=>{
          if(!res.ok){ toast(res.error||'ล้างคิวซ้ำไม่สำเร็จ','err'); return; }
          toast('ล้างคิวซ้ำสำเร็จ','ok');
          load();
        });
      };
    });
    host.querySelectorAll('[data-delid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.delid;
        if(!confirm('ยืนยันลบทรัพย์สิน '+assetId+' ? การลบไม่สามารถย้อนกลับได้')) return;
        apiPost({ action:'adminDeleteAsset', password: STATE.adminPassword, assetId }).then(res=>{
          if(!res.ok){ toast(res.error||'ลบไม่สำเร็จ','err'); return; }
          toast('ลบทรัพย์สินสำเร็จ','ok');
          load();
        });
      };
    });

    document.getElementById('alSelectAll').onchange = (e)=>{
      const ids = rows.map(a=>a.AssetID);
      if(e.target.checked){
        ids.forEach(id=>{ if(STATE.selectedAssetIds.indexOf(id)===-1) STATE.selectedAssetIds.push(id); });
      } else {
        STATE.selectedAssetIds = STATE.selectedAssetIds.filter(id=>ids.indexOf(id)===-1);
      }
      renderTable();
    };
    host.querySelectorAll('.alRowChk').forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.id;
        if(chk.checked){
          if(STATE.selectedAssetIds.indexOf(id)===-1) STATE.selectedAssetIds.push(id);
        } else {
          STATE.selectedAssetIds = STATE.selectedAssetIds.filter(x=>x!==id);
        }
        updateSelCount();
      };
    });
    makeRowsClickable(host, 'alRowChk');
    host.querySelectorAll('.alTagSelect').forEach(sel=>{
      sel.onchange = ()=> updateTag(sel.dataset.id, sel.value);
    });
    updateSelCount();
  }

  function updateTag(assetId, newTag){
    apiPost({ action:'adminSaveAsset', password: STATE.adminPassword, asset:{ AssetID: assetId, Tag: newTag } }).then(res=>{
      if(!res.ok){ toast(res.error||'บันทึกแท็กสถานะไม่สำเร็จ','err'); load(); return; }
      const a = STATE.assetsFull.find(x=>x.AssetID===assetId);
      if(a) a.Tag = newTag;
      toast('บันทึกแท็กสถานะสำเร็จ','ok');
    });
  }

  function updateSelCount(){
    document.getElementById('alSelCount').textContent = 'เลือกไว้ '+STATE.selectedAssetIds.length+' รายการ';
    const alertEl = document.getElementById('alStatusAlert');
    if(alertEl){
      const sel = selectedAssetObjs();
      const statuses = new Set(sel.map(a=>a.AssetStatus||'Active'));
      const queuedPurposes = selectedQueuedPurposes(sel);
      if(statuses.size > 1){
        alertEl.textContent = '⚠ รายการที่เลือกมีสถานะทรัพย์สินมากกว่า 1 สถานะ กรุณาเลือกเฉพาะทรัพย์สินที่มีสถานะเดียวกัน';
        alertEl.style.display = 'block';
      } else if(queuedPurposes.size > 1){
        alertEl.textContent = '⚠ รายการที่เลือกอยู่ในคิวรอต่างประเภทกัน (โอนย้าย/ขาย/ตัดชำรุด) กรุณาเลือกเฉพาะกลุ่มที่รอคิวประเภทเดียวกัน หรือยังไม่เข้าคิว';
        alertEl.style.display = 'block';
      } else {
        alertEl.style.display = 'none';
      }
    }
  }

  // ทรัพย์สิน 1 รายการอยู่ในคิวรอได้ทีละ 1 ประเภทเท่านั้น (บังคับฝั่ง backend ด้วย) — แต่ถ้าเลือกหลายรายการมารวมกัน
  // อาจได้ทรัพย์สินที่รอคิวคนละประเภทปนกันมา ฟังก์ชันนี้รวบรวมประเภทคิวที่พบในรายการที่เลือก (ไม่รวมรายการที่ยังไม่เข้าคิว)
  function selectedQueuedPurposes(selected){
    const purposes = new Set();
    selected.forEach(a=>{ (STATE.assetQueuedPurposes[a.AssetID]||[]).forEach(p=>purposes.add(p)); });
    return purposes;
  }

  function selectedAssetObjs(){
    return STATE.assetsFull.filter(a => STATE.selectedAssetIds.indexOf(a.AssetID)!==-1);
  }

  function startFromSelection(targetView){
    const selected = selectedAssetObjs();
    if(!selected.length){ toast('กรุณาเลือกทรัพย์สินอย่างน้อย 1 รายการ','err'); return; }
    const disposed = selected.filter(a => (a.AssetStatus||'Active') !== 'Active');
    if(disposed.length){ toast('มีรายการที่ขาย/ตัดชำรุดไปแล้ว กรุณาเลือกเฉพาะทรัพย์สินที่ใช้งานอยู่','err'); return; }
    if(selectedQueuedPurposes(selected).size > 1){ toast('มีรายการที่เลือกอยู่ในคิวรอต่างประเภทกัน (โอนย้าย/ขาย/ตัดชำรุด) กรุณาเลือกเฉพาะกลุ่มที่รอคิวประเภทเดียวกัน หรือยังไม่เข้าคิว','err'); return; }

    if(targetView === 'create'){
      STATE.draftItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, images: a.DisplayImage ? [a.DisplayImage] : [],
        remark: '', fromDeptName:'', toDeptName:'', fromSignName:'', toSignName:''
      }));
    } else if(targetView === 'saleCreate'){
      STATE.draftSaleItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, images: a.DisplayImage ? [a.DisplayImage] : [],
        scrapPrice: a.ScrapPrice||'', auctionPrice:'', salePrice: a.MinSalePrice||'', remark:''
      }));
    } else if(targetView === 'writeOffCreate'){
      STATE.draftWriteOffItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, images: a.DisplayImage ? [a.DisplayImage] : [],
        scrapPrice: a.ScrapPrice||'', remark:''
      }));
    }
    STATE.view = targetView;
    render();
  }

  function restoreSelected(){
    const selected = selectedAssetObjs().filter(a => (a.AssetStatus||'Active') !== 'Active');
    if(!selected.length){ toast('กรุณาเลือกทรัพย์สินที่มีสถานะขายแล้ว/ตัดชำรุด','err'); return; }
    if(!confirm('ยืนยันคืนสถานะใช้งานทรัพย์สิน '+selected.length+' รายการ?')) return;
    let done = 0, failed = 0;
    const next = ()=>{
      if(done+failed >= selected.length){
        toast('คืนสถานะสำเร็จ '+done+' รายการ'+(failed?(' ผิดพลาด '+failed+' รายการ'):''), failed? 'err':'ok');
        load();
        return;
      }
      const a = selected[done+failed];
      apiPost({action:'adminRestoreAsset', password: STATE.adminPassword, assetId: a.AssetID}).then(res=>{
        if(res.ok) done++; else failed++;
        next();
      });
    };
    next();
  }
}

/* ================= DASHBOARD VIEW (ข้อมูลรวม) ================= */
function renderDashboard(root){
  root.innerHTML = `
    <div class="card">
      <h2>ข้อมูลรวมทรัพย์สิน</h2>
      <div id="dashHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;
  apiGet({action:'getAssetListBundle'}).then(res=>{
    if(!res.ok){ document.getElementById('dashHost').innerHTML = 'โหลดไม่สำเร็จ: '+res.error; return; }
    renderDashboardContent(res.data.assets, res.data.transferQueue||[], res.data.saleQueue||[], res.data.writeOffQueue||[]);
  });

  function renderDashboardContent(assets, transferQueue, saleQueue, writeOffQueue){
    const queuedPurposeByAsset = {};
    const mark = (list, purpose)=>{ (list||[]).forEach(q=>{ queuedPurposeByAsset[q.AssetID] = purpose; }); };
    mark(transferQueue, 'transfer');
    mark(saleQueue, 'sale');
    mark(writeOffQueue, 'writeoff');
    const statusLabels = { Active:'ใช้งาน', Sold:'ขายแล้ว', WrittenOff:'ตัดชำรุด' };
    const byStatus = {};
    assets.forEach(a=>{
      const st = a.AssetStatus || 'Active';
      if(!byStatus[st]) byStatus[st] = { count:0, purchase:0, book:0 };
      byStatus[st].count++;
      byStatus[st].purchase += parseFloat(a.PurchasePrice)||0;
      byStatus[st].book += parseFloat(a.BookValue)||0;
    });

    let tilesHtml = '<div class="row">';
    ['Active','Sold','WrittenOff'].forEach(st=>{
      const d = byStatus[st] || { count:0, purchase:0, book:0 };
      tilesHtml += `
        <div class="stat-tile">
          <div class="label">${statusLabels[st]}</div>
          <div class="num">${d.count}</div>
          <div class="sub">มูลค่าตามบัญชีรวม ${fmtMoneyOrHidden(d.book)} บาท</div>
        </div>`;
    });
    tilesHtml += `
      <div class="stat-tile">
        <div class="label">ทั้งหมด</div>
        <div class="num">${assets.length}</div>
        <div class="sub">ราคาซื้อรวม ${fmtMoney(assets.reduce((s,a)=>s+(parseFloat(a.PurchasePrice)||0),0))} บาท</div>
      </div>`;
    tilesHtml += '</div>';

    const byDept = {};
    assets.forEach(a=>{
      const d = a.Department || '-';
      if(!byDept[d]) byDept[d] = { count:0, purchase:0, book:0, active:0, sold:0, writtenOff:0, transfer:0, sale:0, writeoff:0, noQueue:0 };
      byDept[d].count++;
      byDept[d].purchase += parseFloat(a.PurchasePrice)||0;
      byDept[d].book += parseFloat(a.BookValue)||0;
      const st = a.AssetStatus || 'Active';
      if(st==='Active') byDept[d].active++;
      else if(st==='Sold') byDept[d].sold++;
      else if(st==='WrittenOff') byDept[d].writtenOff++;
      const purpose = queuedPurposeByAsset[a.AssetID];
      if(purpose==='transfer') byDept[d].transfer++;
      else if(purpose==='sale') byDept[d].sale++;
      else if(purpose==='writeoff') byDept[d].writeoff++;
      else byDept[d].noQueue++;
    });
    const deptRows = Object.keys(byDept).sort().map(d=>{
      const v = byDept[d];
      return `<tr><td>${esc(d)}</td><td style="text-align:center;">${v.count}</td><td style="text-align:center;">${v.active}</td><td style="text-align:center;">${v.sold}</td><td style="text-align:center;">${v.writtenOff}</td><td class="money">${fmtMoney(v.purchase)}</td><td class="money">${fmtMoneyOrHidden(v.book)}</td></tr>`;
    }).join('');
    const deptQueueRows = Object.keys(byDept).sort().map(d=>{
      const v = byDept[d];
      const totalQueued = v.transfer + v.sale + v.writeoff;
      return `<tr><td>${esc(d)}</td><td style="text-align:center;">${v.transfer}</td><td style="text-align:center;">${v.sale}</td><td style="text-align:center;">${v.writeoff}</td><td style="text-align:center;font-weight:600;">${totalQueued}</td></tr>`;
    }).join('');

    const byTag = {};
    assets.forEach(a=>{
      const t = a.Tag || 'ใช้งาน';
      byTag[t] = (byTag[t]||0) + 1;
    });
    const tagRows = ASSET_TAGS.map(t=>`<tr><td>${esc(t)}</td><td style="text-align:center;">${byTag[t]||0}</td></tr>`).join('');

    document.getElementById('dashHost').innerHTML = `
      <div class="toolbar no-print" style="justify-content:flex-end;margin-bottom:10px;">
        <button class="btn btn-secondary btn-sm" id="btnDashExport">⬇ Export Excel</button>
      </div>
      ${tilesHtml}
      <div class="row" style="margin-top:24px;align-items:flex-start;">
        <div style="flex:2;min-width:280px;">
          <h2>สรุปแยกตามหน่วยงาน (ตามสถานะ)</h2>
          <div style="overflow-x:auto;">
            <table><tr><th>หน่วยงาน</th><th>จำนวนทั้งหมด</th><th>ใช้งาน</th><th>ขายแล้ว</th><th>ตัดชำรุด</th><th>ราคาซื้อรวม</th><th>มูลค่าตามบัญชีรวม</th></tr>
            ${deptRows || '<tr><td colspan="7" class="empty">ไม่มีข้อมูล</td></tr>'}
            </table>
          </div>
        </div>
        <div style="flex:1;min-width:200px;">
          <h2>สรุปแยกตามแท็กสถานะ</h2>
          <table><tr><th>แท็กสถานะ</th><th>จำนวน</th></tr>${tagRows}</table>
        </div>
      </div>
      <div style="margin-top:24px;">
        <h2>สรุปแยกตามหน่วยงาน (ตามการจัดการ / คิวรอ)</h2>
        <p style="color:var(--muted);font-size:13px;">จำนวนทรัพย์สินที่ถูกมาร์คไว้รอออกใบโอนย้าย/ขาย/ตัดชำรุด แยกตามหน่วยงาน (ดูเพิ่มเติมได้ที่คอลัมน์ "จัดการ" ในหน้ารายการทรัพย์สิน)</p>
        <div style="overflow-x:auto;">
          <table><tr><th>หน่วยงาน</th><th>รอโอนย้าย</th><th>รอขาย</th><th>รอตัดชำรุด</th><th>รวมที่รอคิว</th></tr>
          ${deptQueueRows || '<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>'}
          </table>
        </div>
      </div>
    `;

    document.getElementById('btnDashExport').onclick = ()=>{
      const statusSheet = {
        name: 'สรุปตามสถานะ',
        header: ['สถานะ','จำนวน','ราคาซื้อรวม','มูลค่าตามบัญชีรวม'],
        rows: ['Active','Sold','WrittenOff'].map(st=>{
          const d = byStatus[st] || { count:0, purchase:0, book:0 };
          return [statusLabels[st], d.count, d.purchase, canSeePrice() ? d.book : 'ไม่มีสิทธิ์ดู'];
        }).concat([['ทั้งหมด', assets.length, assets.reduce((s,a)=>s+(parseFloat(a.PurchasePrice)||0),0), canSeePrice() ? assets.reduce((s,a)=>s+(parseFloat(a.BookValue)||0),0) : 'ไม่มีสิทธิ์ดู']])
      };
      const deptSheet = {
        name: 'สรุปตามหน่วยงาน',
        header: ['หน่วยงาน','จำนวนทั้งหมด','ใช้งาน','ขายแล้ว','ตัดชำรุด','ราคาซื้อรวม','มูลค่าตามบัญชีรวม'],
        rows: Object.keys(byDept).sort().map(d=>{
          const v = byDept[d];
          return [d, v.count, v.active, v.sold, v.writtenOff, v.purchase, canSeePrice() ? v.book : 'ไม่มีสิทธิ์ดู'];
        })
      };
      const deptQueueSheet = {
        name: 'สรุปการจัดการตามหน่วยงาน',
        header: ['หน่วยงาน','รอโอนย้าย','รอขาย','รอตัดชำรุด','รวมที่รอคิว'],
        rows: Object.keys(byDept).sort().map(d=>{
          const v = byDept[d];
          return [d, v.transfer, v.sale, v.writeoff, v.transfer+v.sale+v.writeoff];
        })
      };
      const tagSheet = {
        name: 'สรุปตามแท็กสถานะ',
        header: ['แท็กสถานะ','จำนวน'],
        rows: ASSET_TAGS.map(t=>[t, byTag[t]||0])
      };
      exportExcel('ข้อมูลรวมทรัพย์สิน.xlsx', [statusSheet, deptSheet, deptQueueSheet, tagSheet]);
    };
  }
}

/* ================= AUCTION VIEW (ประมูลขาย) — รวมคิวรอขาย + รอตัดชำรุด ให้ทุกคนดูได้ ================= */
function renderAuction(root){
  let showBookValue = false;
  let auctionRows = [];

  root.innerHTML = `
    <div class="card">
      <h2>ประมูลขาย</h2>
      <p style="color:var(--muted);font-size:13px;">รวมทรัพย์สินที่อยู่ในคิวรอขาย และคิวรอตัดชำรุดทั้งหมด สำหรับใช้ประกอบการประมูล</p>
      <div class="toolbar no-print">
        <input type="text" id="auctionSearch" placeholder="ค้นหารหัส / ชื่อทรัพย์สิน..." style="max-width:220px;">
        ${STATE.role==='admin' ? `<button class="btn btn-secondary btn-sm" id="btnAuctionToggleBookValue">👁 แสดงมูลค่าตามบัญชี</button>` : ''}
        <span id="auctionCount" style="font-size:13px;color:var(--muted);margin-left:auto;">รวม 0 รายการ</span>
        <button class="btn btn-secondary btn-sm" id="btnAuctionExport">⬇ Export Excel</button>
      </div>
      <div id="auctionTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;

  document.getElementById('auctionSearch').oninput = renderAuctionTable;
  document.getElementById('btnAuctionExport').onclick = exportAuction;
  const toggleBtn = document.getElementById('btnAuctionToggleBookValue');
  if(toggleBtn){
    toggleBtn.onclick = ()=>{
      showBookValue = !showBookValue;
      toggleBtn.textContent = showBookValue ? '🙈 ซ่อนมูลค่าตามบัญชี' : '👁 แสดงมูลค่าตามบัญชี';
      renderAuctionTable();
    };
  }

  function load(){
    document.getElementById('auctionTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet({ action:'getAssetListBundle' }).then(res=>{
      if(!res.ok){ document.getElementById('auctionTableHost').innerHTML = 'โหลดไม่สำเร็จ: '+esc(res.error||''); return; }
      const saleRows = (res.data.saleQueue||[]).map(a=>Object.assign({}, a, { queueType:'sale' }));
      const woRows = (res.data.writeOffQueue||[]).map(a=>Object.assign({}, a, { queueType:'writeoff' }));
      auctionRows = saleRows.concat(woRows).sort((a,b)=> new Date(b.AddedAt) - new Date(a.AddedAt));
      renderAuctionTable();
    });
  }

  function renderAuctionTable(){
    const host = document.getElementById('auctionTableHost');
    const qq = (document.getElementById('auctionSearch').value||'').trim().toLowerCase();
    const rows = qq ? auctionRows.filter(r => String(r.AssetID).toLowerCase().indexOf(qq)!==-1 || String(r.AssetName).toLowerCase().indexOf(qq)!==-1) : auctionRows;
    document.getElementById('auctionCount').textContent = 'รวม '+rows.length+' รายการ';
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่มีทรัพย์สินรอขาย/ตัดชำรุด</div>'; return; }
    const typeLabel = { sale:'รอขาย', writeoff:'รอตัดชำรุด' };
    let html = `<div style="overflow-x:auto;"><table><tr><th>รูป</th><th>รหัส</th><th>ชื่อทรัพย์สิน</th><th>หน่วยงาน</th><th>ประเภท</th><th>ราคาซาก</th><th>มูลค่าตามบัญชี</th></tr>`;
    rows.forEach(a=>{
      html += `<tr>
        <td><img class="thumb" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(a.DisplayImage||'')}')"></td>
        <td><b>${esc(a.AssetID)}</b></td>
        <td>${esc(a.AssetName)}</td>
        <td>${esc(a.Department)}</td>
        <td><span class="badge badge-pending">${typeLabel[a.queueType]}</span></td>
        <td class="money">${fmtMoneyOrHidden(a.ScrapPrice)}</td>
        <td class="money">${showBookValue ? fmtMoney(a.BookValue) : '••••••'}</td>
      </tr>`;
    });
    html += '</table></div>';
    host.innerHTML = html;
  }

  function exportAuction(){
    if(!auctionRows.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const typeLabel = { sale:'รอขาย', writeoff:'รอตัดชำรุด' };
    const header = ['รหัส','ชื่อทรัพย์สิน','หน่วยงาน','ประเภท','ราคาซาก','มูลค่าตามบัญชี','ลิงก์รูปภาพ'];
    const rows = auctionRows.map(a => [
      a.AssetID, a.AssetName, a.Department, typeLabel[a.queueType],
      canSeePrice() ? (Number(a.ScrapPrice)||0) : 'ไม่มีสิทธิ์ดู',
      showBookValue ? (Number(a.BookValue)||0) : 'ไม่แสดง',
      a.DisplayImage||''
    ]);
    exportExcel('ประมูลขาย.xlsx', [{ name:'ประมูลขาย', header, rows }]);
  }

  load();
}

/* ================= LIST VIEW ================= */
function renderList(root){
  root.innerHTML = `
    <div class="card" id="queueCard" ${isViewOnly() ? 'style="display:none;"' : ''}>
      <h2>รายการรอออกใบโอนย้าย</h2>
      <p style="color:var(--muted);font-size:13px;">ทรัพย์สินที่มาร์คไว้จากหน้า "รายการทรัพย์สิน" (ปุ่ม "+ คิวโอนย้าย") รอรวมออกเป็นใบโอนย้าย — เลือกรายการที่ต้องการแล้วกดสร้างใบ</p>
      <div class="toolbar no-print">
        <input type="text" id="qSearch" placeholder="ค้นหารหัส / ชื่อทรัพย์สิน..." style="max-width:220px;">
        <span id="queueSelCount" style="font-size:13px;color:var(--muted);">เลือกไว้ 0 รายการ</span>
        <button class="btn btn-primary btn-sm" id="btnCreateFromQueue">สร้างใบโอนย้ายจากรายการที่เลือก</button>
        <button class="btn btn-secondary btn-sm" id="btnQueueRefresh">↻ รีเฟรช</button>
      </div>
      <div id="queueTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>

    <div class="card">
      <h2>รายการใบโอนย้ายทรัพย์สิน</h2>
      <div class="toolbar no-print">
        <input type="text" id="fSearch" placeholder="ค้นหาเลขที่ / เรื่อง..." style="max-width:220px;">
        <select id="fStatus" style="max-width:160px;">
          <option value="">ทุกสถานะ</option>
          <option value="PendingApproval">รออนุมัติ</option>
          <option value="Approved">อนุมัติแล้ว</option>
          <option value="Rejected">ไม่อนุมัติ</option>
        </select>
        <input type="date" id="fFrom" style="max-width:150px;">
        <input type="date" id="fTo" style="max-width:150px;">
        <button class="btn btn-secondary btn-sm" id="btnFilter">กรอง</button>
        <button class="btn btn-secondary btn-sm" id="btnRefresh">↻ รีเฟรช</button>
        <span id="listCount" style="font-size:13px;color:var(--muted);margin-left:auto;">รวม 0 รายการ</span>
        <button class="btn btn-secondary btn-sm" id="btnListExport">⬇ Export Excel</button>
      </div>
      <div id="listTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;
  document.getElementById('btnFilter').onclick = loadList;
  document.getElementById('btnRefresh').onclick = loadList;
  document.getElementById('fStatus').onchange = loadList;
  document.getElementById('fFrom').onchange = loadList;
  document.getElementById('fTo').onchange = loadList;
  document.getElementById('btnListExport').onclick = exportTransferList;
  document.getElementById('btnCreateFromQueue').onclick = createTransferFromQueue;
  document.getElementById('btnQueueRefresh').onclick = loadQueue;
  document.getElementById('qSearch').oninput = renderQueueTable;
  loadList();
  loadQueue();

  function loadQueue(){
    document.getElementById('queueTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet({action:'getTransferQueue'}).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดคิวไม่สำเร็จ','err'); return; }
      STATE.transferQueue = deptFilterRows(res.data, ['Department']);
      STATE.selectedQueueAssetIds = STATE.selectedQueueAssetIds.filter(id => STATE.transferQueue.some(q=>q.AssetID===id));
      renderQueueTable();
    });
  }

  function renderQueueTable(){
    const host = document.getElementById('queueTableHost');
    if(!STATE.transferQueue.length){ host.innerHTML = '<div class="empty">ยังไม่มีรายการรอโอนย้าย — เพิ่มได้จากหน้า "รายการทรัพย์สิน"</div>'; updateQueueSelCount(); return; }
    const qq = (document.getElementById('qSearch').value||'').trim().toLowerCase();
    const rows = qq ? STATE.transferQueue.filter(r => String(r.AssetID).toLowerCase().indexOf(qq)!==-1 || String(r.AssetName).toLowerCase().indexOf(qq)!==-1) : STATE.transferQueue;
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่พบทรัพย์สินที่ค้นหา</div>'; updateQueueSelCount(); return; }
    const selectableRows = rows.filter(q=>(q.AssetStatus||'Active')==='Active');
    const allSelected = selectableRows.length>0 && selectableRows.every(q=>STATE.selectedQueueAssetIds.indexOf(q.AssetID)!==-1);
    let html = `<div style="overflow-x:auto;"><table><tr><th class="no-print"><input type="checkbox" id="queueSelectAll" ${allSelected?'checked':''}></th><th>รูป</th><th>รหัส</th><th>ชื่อทรัพย์สิน</th><th>หน่วยงาน</th><th>เพิ่มโดย</th><th>เมื่อ</th><th class="no-print">จัดการ</th></tr>`;
    rows.forEach(q=>{
      const disabled = (q.AssetStatus||'Active')!=='Active';
      const checked = STATE.selectedQueueAssetIds.indexOf(q.AssetID)!==-1 ? 'checked' : '';
      html += `<tr>
        <td class="no-print"><input type="checkbox" class="queueRowChk" data-id="${esc(q.AssetID)}" ${checked} ${disabled?'disabled':''}></td>
        <td><img class="thumb" src="${esc(q.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(q.DisplayImage||'')}')"></td>
        <td><b>${esc(q.AssetID)}</b></td>
        <td>${esc(q.AssetName)}${disabled?' <span class="badge badge-rejected">ไม่ว่างแล้ว</span>':''}</td>
        <td>${esc(q.Department)}</td>
        <td>${esc(q.AddedBy||'-')}</td>
        <td>${fmtDate(q.AddedAt)}</td>
        <td class="no-print"><button class="btn btn-red btn-sm" data-unqueueid="${esc(q.AssetID)}">เอาออก</button></td>
      </tr>`;
    });
    html += '</table></div>';
    host.innerHTML = html;

    document.getElementById('queueSelectAll').onchange = (e)=>{
      const ids = rows.filter(q=>(q.AssetStatus||'Active')==='Active').map(q=>q.AssetID);
      if(e.target.checked){ ids.forEach(id=>{ if(STATE.selectedQueueAssetIds.indexOf(id)===-1) STATE.selectedQueueAssetIds.push(id); }); }
      else { STATE.selectedQueueAssetIds = STATE.selectedQueueAssetIds.filter(id=>ids.indexOf(id)===-1); }
      renderQueueTable();
    };
    host.querySelectorAll('.queueRowChk').forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.id;
        if(chk.checked){ if(STATE.selectedQueueAssetIds.indexOf(id)===-1) STATE.selectedQueueAssetIds.push(id); }
        else { STATE.selectedQueueAssetIds = STATE.selectedQueueAssetIds.filter(x=>x!==id); }
        updateQueueSelCount();
      };
    });
    makeRowsClickable(host, 'queueRowChk');
    host.querySelectorAll('[data-unqueueid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.unqueueid;
        apiPost({ action:'removeFromTransferQueue', assetIds:[assetId] }).then(res=>{
          if(!res.ok){ toast(res.error||'เอาออกจากคิวไม่สำเร็จ','err'); return; }
          STATE.selectedQueueAssetIds = STATE.selectedQueueAssetIds.filter(x=>x!==assetId);
          loadQueue();
        });
      };
    });
    updateQueueSelCount();
  }

  function updateQueueSelCount(){
    const el = document.getElementById('queueSelCount');
    if(el) el.textContent = 'เลือกไว้ '+STATE.selectedQueueAssetIds.length+' รายการ';
  }

  function createTransferFromQueue(){
    const selected = STATE.transferQueue.filter(q => STATE.selectedQueueAssetIds.indexOf(q.AssetID)!==-1 && (q.AssetStatus||'Active')==='Active');
    if(!selected.length){ toast('กรุณาเลือกรายการจากคิวอย่างน้อย 1 รายการ','err'); return; }
    STATE.draftItems = selected.map(q => ({
      assetId: q.AssetID, assetName: q.AssetName, images: q.DisplayImage ? [q.DisplayImage] : [],
      remark: '', fromDeptName:'', toDeptName:'', fromSignName:'', toSignName:''
    }));
    STATE.view = 'create';
    render();
  }

  function exportTransferList(){
    if(!STATE.transfers.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const header = ['เลขที่','วันที่','เรื่อง','จาก','ไป','จำนวนรายการ','สถานะ','ผู้อนุมัติ','ลิงก์รูปภาพ'];
    const dataRows = STATE.transfers.map(t => [
      t.RunningNo, fmtDate(t.CreatedAt), t.Subject==='อื่นๆ'?t.SubjectOther:t.Subject,
      t.FromDept, t.ToDept, t.ItemCount, STATUS_LABELS[t.Status]||t.Status, t.ApproverName||t.ApproverEmail||'', t.AllImages||''
    ]);
    exportExcel('รายการใบโอนย้าย.xlsx', [{ name:'ใบโอนย้าย', header, rows: dataRows }]);
  }

  function loadList(){
    const params = { action:'getTransfers' };
    const q = document.getElementById('fSearch').value.trim();
    const status = document.getElementById('fStatus').value;
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    if(q) params.q = q;
    if(status) params.status = status;
    if(from) params.from = from;
    if(to) params.to = to;
    document.getElementById('listTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet(params).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.transfers = deptFilterRows(res.data, ['FromDept','ToDept']);
      renderListTable();
    });
  }
  function renderListTable(){
    const host = document.getElementById('listTableHost');
    document.getElementById('listCount').textContent = 'รวม '+STATE.transfers.length+' รายการ';
    if(!STATE.transfers.length){ host.innerHTML = '<div class="empty">ยังไม่มีใบโอนย้าย</div>'; return; }
    let html = '<table><tr><th>เลขที่</th><th>วันที่</th><th>เรื่อง</th><th>จาก → ไป</th><th>จำนวนรายการ</th><th>สถานะ</th><th>ผู้อนุมัติ</th><th class="no-print">การจัดการ</th></tr>';
    STATE.transfers.forEach(t=>{
      html += `<tr>
        <td><b>${esc(t.RunningNo)}</b></td>
        <td>${fmtDate(t.CreatedAt)}</td>
        <td>${esc(t.Subject==='อื่นๆ'?t.SubjectOther:t.Subject)}</td>
        <td>${esc(t.FromDept)} → ${esc(t.ToDept)}</td>
        <td style="text-align:center;">${t.ItemCount}</td>
        <td>${statusBadge(t.Status)}</td>
        <td>${esc(t.ApproverName||t.ApproverEmail||'-')}</td>
        <td class="no-print">
          <button class="btn btn-secondary btn-sm" onclick="openPrint('${t.TransferID}')">ดู/พิมพ์</button>
          ${t.Status==='Approved' ? `<button class="btn btn-secondary btn-sm" onclick="sendNotifyEmail('transfer','${t.TransferID}',this)">📧 ${t.NotifiedAt?'ส่งซ้ำ':'แจ้งบัญชี/GA'}</button>
          <div style="font-size:11px;color:${t.NotifiedAt?'var(--green)':'var(--muted)'};margin-top:2px;">${t.NotifiedAt?('✅ ส่งแล้ว '+fmtDate(t.NotifiedAt)):'ยังไม่ส่ง'}</div>` : ''}
        </td>
      </tr>`;
    });
    html += '</table>';
    host.innerHTML = html;
  }
}

window.openPrint = function(id){
  STATE.view = 'print';
  STATE.printId = id;
  render();
};

// ปุ่ม "แจ้งบัญชี/GA" ในตารางรายการใบโอนย้าย/ขายออก/ตัดชำรุด (เฉพาะเอกสารที่อนุมัติแล้ว) — ส่งอีเมลแจ้งเตือน
// ไปยังอีเมลฝ่ายบัญชี/GA ที่ Admin ตั้งค่าไว้ในหน้า "ตั้งค่า"
window.sendNotifyEmail = function(docType, id, btn){
  if(btn) btn.disabled = true;
  apiPost({ action:'notifyAccountingGA', docType, id, by: STATE.username||'' }).then(res=>{
    if(btn) btn.disabled = false;
    if(!res.ok){ toast(res.error||'ส่งอีเมลแจ้งเตือนไม่สำเร็จ','err'); return; }
    toast('ส่งอีเมลแจ้งบัญชี/GA สำเร็จ','ok');
    render();
  });
};

        <div>

          <input type="text" id="cToSign" placeholder="ชื่อ-นามสกุล ผู้รับโอน" value="${esc(h.toSign||'')}">
        </div>
      </div>

        <div>
          <label>ชื่อผู้ขอ (ผู้บันทึกรายการ)</label>

        </div>

          <input type="email" id="cCreatedByEmail" value="${esc(h.createdByEmail||'')}">
        </div>
      </div>
      <div class="row">

    const fromDept = document.getElementById('cFromDept').value;
    const approverEmail = document.getElementById('cApproverEmail').value.trim();
    if(!deptSkipsApproval(fromDept) && !approverEmail){ toast('กรุณาระบุอีเมลผู้อนุมัติ','err'); return; }
    const toDept = document.getElementById('cToDept').value;
    const fromSign = document.getElementById('cFromSign').value;
    const toSign = document.getElementById('cToSign').value;

    STATE.draftItems.forEach(it=>{
      it.fromDeptName = it.fromDeptName || fromDept;
      it.toDeptName = it.toDeptName || toDept;
      it.fromSignName = it.fromSignName || fromSign;
      it.toSignName = it.toSignName || toSign;

      const fromDepts = STATE.role==='admin' ? res.data : res.data.filter(d=>(STATE.myDepartments||[]).indexOf(d.DeptName)!==-1);

      document.getElementById('cToDept').innerHTML = opts;

  function loadAssetsForSearch(){
    if(STATE.assets.length) return;
    apiGet({action:'getAssets'}).then(res=>{
      if(res.ok) STATE.assets = res.data;
    });
  }

  const searchInput = document.getElementById('assetSearch');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    const suggestBox = document.getElementById('assetSuggest');
    if(!q){ suggestBox.style.display='none'; return; }
    const matches = STATE.assets.filter(a =>
      String(a.AssetID).toLowerCase().includes(q) || String(a.AssetName).toLowerCase().includes(q)
    ).slice(0,15);
    if(!matches.length){ suggestBox.innerHTML = '<div class="autocomplete-item">ไม่พบรายการ</div>'; suggestBox.style.display='block'; return; }
    suggestBox.innerHTML = matches.map(a => `
      <div class="autocomplete-item" data-id="${esc(a.AssetID)}">
        <img class="thumb" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(a.DisplayImage||'')}')">
        <div><b>${esc(a.AssetID)}</b> — ${esc(a.AssetName)}<br><span style="color:var(--muted);font-size:11px;">${esc(a.Department)}</span></div>
      </div>`).join('');
    suggestBox.style.display='block';
    suggestBox.querySelectorAll('.autocomplete-item').forEach(el=>{
      el.onclick = ()=>{
        const asset = STATE.assets.find(a=>a.AssetID===el.dataset.id);
        addItem(asset);
        searchInput.value='';
        suggestBox.style.display='none';
      };
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.autocomplete-wrap')) {
      const box = document.getElementById('assetSuggest');
      if(box) box.style.display='none';
    }
  });

  function addItem(asset){
    STATE.draftItems.push({
      assetId: asset.AssetID,
      assetName: asset.AssetName,
      images: asset.DisplayImage ? [asset.DisplayImage] : [],
      remark: '',
      fromDeptName: document.getElementById('cFromDept').value,
      toDeptName: document.getElementById('cToDept').value,
      fromSignName: document.getElementById('cFromSign').value,
      toSignName: document.getElementById('cToSign').value
    });
    renderItems();
  }

  function renderItems(){
    const host = document.getElementById('itemsHost');
    const empty = document.getElementById('itemsEmpty');
    empty.style.display = STATE.draftItems.length ? 'none':'block';
    host.innerHTML = STATE.draftItems.map((it, i) => `
      <div class="item-line">
        <button class="del" onclick="removeItem(${i})">✕</button>
        <div class="row">
          <div style="flex:0 0 auto;">
            <div class="item-img-gallery">
              ${(it.images||[]).map((url,gi)=>`
                <div class="item-img-thumb">
                  <img src="${esc(url)}" onerror="this.style.visibility='hidden'" style="cursor:zoom-in;" onclick="openImageLightbox('${esc(url)}')">
                  <button type="button" class="del-img" onclick="removeItemImage(${i},${gi})">✕</button>
                </div>`).join('')}
              ${(it.images||[]).length < ITEM_IMAGE_LIMIT ? `
                <div class="item-img-add" onclick="document.getElementById('itemFile${i}').click()">+ เพิ่มรูป<br>(${(it.images||[]).length}/${ITEM_IMAGE_LIMIT})</div>
                <div class="item-img-add" onclick="document.getElementById('itemCam${i}').click()">📷 ถ่ายรูป</div>
              ` : ''}
            </div>
            <input type="file" id="itemFile${i}" accept="image/*" style="display:none;" onchange="uploadItemImage(${i}, this)">
            <input type="file" id="itemCam${i}" accept="image/*" capture="environment" style="display:none;" onchange="uploadItemImage(${i}, this)">
          </div>
          <div style="flex:2;">
            <b>${esc(it.assetId)}</b> — ${esc(it.assetName)}
            <label style="margin-top:6px;">หมายเหตุ</label>
            <input type="text" value="${esc(it.remark)}" onchange="updateItemField(${i},'remark',this.value)">
          </div>
        </div>
      </div>
    `).join('');
  }

  window.removeItem = (i)=>{ STATE.draftItems.splice(i,1); renderItems(); };
  window.updateItemField = (i, field, val)=>{ STATE.draftItems[i][field] = val; };
  window.removeItemImage = (i, gi)=>{ STATE.draftItems[i].images.splice(gi,1); renderItems(); };
  window.uploadItemImage = (i, input)=>{
    const file = input.files[0];
    if(!file) return;
    if(!STATE.draftItems[i].images) STATE.draftItems[i].images = [];
    if(STATE.draftItems[i].images.length >= ITEM_IMAGE_LIMIT){ toast('เพิ่มรูปได้สูงสุด '+ITEM_IMAGE_LIMIT+' รูปต่อรายการ','err'); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      toast('กำลังอัปโหลดรูป...');
      apiPost({ action:'uploadImage', password: STATE.adminPassword, base64: reader.result, contentType: file.type, fileName: STATE.draftItems[i].assetId })
        .then(res=>{
          if(res.ok){
            STATE.draftItems[i].images.push(res.data.url);
            renderItems();
            toast('อัปโหลดรูปสำเร็จ','ok');
          } else toast(res.error||'อัปโหลดไม่สำเร็จ','err');
        });
    };
    reader.readAsDataURL(file);
    input.value = '';
  };

}

    CreatedAt: new Date().toISOString(),
    Subject: h.subject, SubjectOther: h.subjectOther, Purpose: h.purpose,

    }))

  root.innerHTML = `

      <button class="btn btn-secondary btn-sm" id="btnPreviewBack">← กลับไปแก้ไข</button>
      <button class="btn btn-secondary btn-sm" id="btnPreviewPrint">🖨️ พิมพ์ตัวอย่าง</button>
      <button class="btn btn-primary btn-sm" id="btnPreviewConfirm" style="margin-left:auto;">✔ ยืนยันบันทึกและส่งอีเมลขออนุมัติ</button>
    </div>
    ${buildDocHtml(draftDoc, false)}
  `;
  document.getElementById('btnPreviewBack').onclick = ()=>{ STATE.createStep='form'; render(); };
  document.getElementById('btnPreviewPrint').onclick = ()=> window.print();
  document.getElementById('btnPreviewConfirm').onclick = doSubmitTransfer;
}

function doSubmitTransfer(){
  const h = STATE.transferHeader;
  const payload = {
    action:'createTransfer',
    password: STATE.adminPassword,
    subject: h.subject, subjectOther: h.subjectOther, purpose: h.purpose,
    fromDept: h.fromDept, toDept: h.toDept,
    createdBy: h.createdBy, createdByEmail: h.createdByEmail,
    approverName: h.approverName, approverEmail: h.approverEmail,
    items: STATE.draftItems
  };
  const btn = document.getElementById('btnPreviewConfirm');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
  apiPost(payload).then(res=>{
    if(!res.ok){
      btn.disabled = false; btn.innerHTML = '✔ ยืนยันบันทึกและส่งอีเมลขออนุมัติ';
      toast(res.error||'บันทึกไม่สำเร็จ','err');
      return;
    }
    toast('สร้างใบโอนย้าย '+res.data.runningNo+' สำเร็จ '+(res.data.autoApproved ? 'อนุมัติอัตโนมัติ (หน่วยงานนี้ไม่ต้องขออนุมัติ)' : 'ส่งอีเมลขออนุมัติแล้ว'),'ok');
    const submittedAssetIds = STATE.draftItems.map(it=>it.assetId);
    if(submittedAssetIds.length) apiPost({ action:'removeFromTransferQueue', assetIds: submittedAssetIds });
    STATE.selectedQueueAssetIds = STATE.selectedQueueAssetIds.filter(id=>submittedAssetIds.indexOf(id)===-1);
    STATE.draftItems = [];
    STATE.transferHeader = null;
    STATE.createStep = 'form';
    STATE.view = 'print';
    STATE.printId = res.data.transferId;
    render();
  });
}
