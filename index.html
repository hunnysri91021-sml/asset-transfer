        <span id="saleListCount" style="font-size:13px;color:var(--muted);margin-left:auto;">รวม 0 รายการ</span>
        <button class="btn btn-secondary btn-sm" id="btnSaleExport">⬇ Export Excel</button>
      </div>
      <div id="saleListTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;
  document.getElementById('btnSaleFilter').onclick = loadSaleList;
  document.getElementById('btnSaleRefresh').onclick = loadSaleList;
  document.getElementById('fSaleStatus').onchange = loadSaleList;
  document.getElementById('fSaleFrom').onchange = loadSaleList;
  document.getElementById('fSaleTo').onchange = loadSaleList;
  document.getElementById('btnSaleExport').onclick = exportSaleList;
  document.getElementById('btnCreateFromSaleQueue').onclick = createSaleFromQueue;
  document.getElementById('btnSaleQueueRefresh').onclick = loadSaleQueue;
  document.getElementById('saleQSearch').oninput = renderSaleQueueTable;
  loadSaleList();
  loadSaleQueue();

  function loadSaleQueue(){
    document.getElementById('saleQueueTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet({action:'getSaleQueue'}).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดคิวไม่สำเร็จ','err'); return; }
      STATE.saleQueue = deptFilterRows(res.data, ['Department']);
      STATE.selectedSaleQueueAssetIds = STATE.selectedSaleQueueAssetIds.filter(id => STATE.saleQueue.some(q=>q.AssetID===id));
      renderSaleQueueTable();
    });
  }

  function renderSaleQueueTable(){
    const host = document.getElementById('saleQueueTableHost');
    if(!STATE.saleQueue.length){ host.innerHTML = '<div class="empty">ยังไม่มีรายการรอขายออก — เพิ่มได้จากหน้า "รายการทรัพย์สิน"</div>'; updateSaleQueueSelCount(); return; }
    const qq = (document.getElementById('saleQSearch').value||'').trim().toLowerCase();
    const rows = qq ? STATE.saleQueue.filter(r => String(r.AssetID).toLowerCase().indexOf(qq)!==-1 || String(r.AssetName).toLowerCase().indexOf(qq)!==-1) : STATE.saleQueue;
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่พบทรัพย์สินที่ค้นหา</div>'; updateSaleQueueSelCount(); return; }
    const selectableRows = rows.filter(q=>(q.AssetStatus||'Active')==='Active');
    const allSelected = selectableRows.length>0 && selectableRows.every(q=>STATE.selectedSaleQueueAssetIds.indexOf(q.AssetID)!==-1);
    let html = `<div style="overflow-x:auto;"><table><tr><th class="no-print"><input type="checkbox" id="saleQueueSelectAll" ${allSelected?'checked':''}></th><th>รูป</th><th>รหัส</th><th>ชื่อทรัพย์สิน</th><th>หน่วยงาน</th><th>ราคาซาก</th><th>เพิ่มโดย</th><th>เมื่อ</th><th class="no-print">จัดการ</th></tr>`;
    rows.forEach(q=>{
      const disabled = (q.AssetStatus||'Active')!=='Active';
      const checked = STATE.selectedSaleQueueAssetIds.indexOf(q.AssetID)!==-1 ? 'checked' : '';
      html += `<tr>
        <td class="no-print"><input type="checkbox" class="saleQueueRowChk" data-id="${esc(q.AssetID)}" ${checked} ${disabled?'disabled':''}></td>
        <td><img class="thumb" src="${esc(q.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(q.DisplayImage||'')}')"></td>
        <td><b>${esc(q.AssetID)}</b></td>
        <td>${esc(q.AssetName)}${disabled?' <span class="badge badge-rejected">ไม่ว่างแล้ว</span>':''}</td>
        <td>${esc(q.Department)}</td>
        <td class="money">${fmtMoneyOrHidden(q.ScrapPrice)}</td>
        <td>${esc(q.AddedBy||'-')}</td>
        <td>${fmtDate(q.AddedAt)}</td>
        <td class="no-print"><button class="btn btn-red btn-sm" data-unqueueid="${esc(q.AssetID)}">เอาออก</button></td>
      </tr>`;
    });
    html += '</table></div>';
    host.innerHTML = html;

    document.getElementById('saleQueueSelectAll').onchange = (e)=>{
      const ids = rows.filter(q=>(q.AssetStatus||'Active')==='Active').map(q=>q.AssetID);
      if(e.target.checked){ ids.forEach(id=>{ if(STATE.selectedSaleQueueAssetIds.indexOf(id)===-1) STATE.selectedSaleQueueAssetIds.push(id); }); }
      else { STATE.selectedSaleQueueAssetIds = STATE.selectedSaleQueueAssetIds.filter(id=>ids.indexOf(id)===-1); }
      renderSaleQueueTable();
    };
    host.querySelectorAll('.saleQueueRowChk').forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.id;
        if(chk.checked){ if(STATE.selectedSaleQueueAssetIds.indexOf(id)===-1) STATE.selectedSaleQueueAssetIds.push(id); }
        else { STATE.selectedSaleQueueAssetIds = STATE.selectedSaleQueueAssetIds.filter(x=>x!==id); }
        updateSaleQueueSelCount();
      };
    });
    makeRowsClickable(host, 'saleQueueRowChk');
    host.querySelectorAll('[data-unqueueid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.unqueueid;
        apiPost({ action:'removeFromSaleQueue', assetIds:[assetId] }).then(res=>{
          if(!res.ok){ toast(res.error||'เอาออกจากคิวไม่สำเร็จ','err'); return; }
          STATE.selectedSaleQueueAssetIds = STATE.selectedSaleQueueAssetIds.filter(x=>x!==assetId);
          loadSaleQueue();
        });
      };
    });
    updateSaleQueueSelCount();
  }

  function updateSaleQueueSelCount(){
    const el = document.getElementById('saleQueueSelCount');
    if(el) el.textContent = 'เลือกไว้ '+STATE.selectedSaleQueueAssetIds.length+' รายการ';
  }

  function createSaleFromQueue(){
    const selected = STATE.saleQueue.filter(q => STATE.selectedSaleQueueAssetIds.indexOf(q.AssetID)!==-1 && (q.AssetStatus||'Active')==='Active');
    if(!selected.length){ toast('กรุณาเลือกรายการจากคิวอย่างน้อย 1 รายการ','err'); return; }
    STATE.draftSaleItems = selected.map(q => ({
      assetId: q.AssetID, assetName: q.AssetName, images: q.DisplayImage ? [q.DisplayImage] : [],
      scrapPrice: q.ScrapPrice||'', auctionPrice:'', salePrice: q.MinSalePrice||'', remark:''
    }));
    STATE.view = 'saleCreate';
    render();
  }

  function exportSaleList(){
    if(!STATE.sales.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const header = ['เลขที่','วันที่','หน่วยงาน','ผู้ซื้อ','จำนวนรายการ','รวมราคาขาย','สถานะ','ผู้อนุมัติ','ลิงก์รูปภาพ'];
    const dataRows = STATE.sales.map(s => [
      s.RunningNo, fmtDate(s.CreatedAt), s.FromDept, s.Buyer||'', s.ItemCount,
      Number(s.TotalSalePrice)||0, (s.Status==='Approved'?'ขายแล้ว':(STATUS_LABELS[s.Status]||s.Status)), s.ApproverName||s.ApproverEmail||'', s.AllImages||''
    ]);
    exportExcel('รายการขายออก.xlsx', [{ name:'ขายออก', header, rows: dataRows }]);
  }

  function loadSaleList(){
    const params = { action:'getSales' };
    const q = document.getElementById('fSaleSearch').value.trim();
    const status = document.getElementById('fSaleStatus').value;
    const from = document.getElementById('fSaleFrom').value;
    const to = document.getElementById('fSaleTo').value;
    if(q) params.q = q;
    if(status) params.status = status;
    if(from) params.from = from;
    if(to) params.to = to;
    document.getElementById('saleListTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet(params).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.sales = deptFilterRows(res.data, ['FromDept']);
      renderSaleListTable();
    });
  }
  function renderSaleListTable(){
    const host = document.getElementById('saleListTableHost');
    document.getElementById('saleListCount').textContent = 'รวม '+STATE.sales.length+' รายการ';
    if(!STATE.sales.length){ host.innerHTML = '<div class="empty">ยังไม่มีรายการขายออก</div>'; return; }
    let html = '<table><tr><th>เลขที่</th><th>วันที่</th><th>หน่วยงาน</th><th>ผู้ซื้อ</th><th>จำนวนรายการ</th><th>รวมราคาขาย</th><th>สถานะ</th><th>ผู้อนุมัติ</th><th class="no-print">การจัดการ</th></tr>';
    STATE.sales.forEach(s=>{
      html += `<tr>
        <td><b>${esc(s.RunningNo)}</b></td>
        <td>${fmtDate(s.CreatedAt)}</td>
        <td>${esc(s.FromDept)}</td>
        <td>${esc(s.Buyer||'-')}</td>
        <td style="text-align:center;">${s.ItemCount}</td>
        <td class="money">${fmtMoney(s.TotalSalePrice)}</td>
        <td>${saleStatusBadge(s.Status)}</td>
        <td>${esc(s.ApproverName||s.ApproverEmail||'-')}</td>
        <td class="no-print">
          <button class="btn btn-secondary btn-sm" onclick="openSalePrint('${s.SaleID}')">ดู/พิมพ์</button>
          ${s.Status==='Approved' ? `<button class="btn btn-secondary btn-sm" onclick="sendNotifyEmail('sale','${s.SaleID}',this)">📧 ${s.NotifiedAt?'ส่งซ้ำ':'แจ้งบัญชี/GA'}</button>
          <div style="font-size:11px;color:${s.NotifiedAt?'var(--green)':'var(--muted)'};margin-top:2px;">${s.NotifiedAt?('✅ ส่งแล้ว '+fmtDate(s.NotifiedAt)):'ยังไม่ส่ง'}</div>` : ''}
        </td>
      </tr>`;
    });
    html += '</table>';
    host.innerHTML = html;
  }
}

window.openSalePrint = function(id){
  STATE.view = 'salePrint';
  STATE.printSaleId = id;
  render();
};

/* ================= SALE CREATE VIEW ================= */
function renderSaleCreate(root){
  STATE.draftSaleItems = STATE.draftSaleItems && STATE.view==='saleCreate' ? STATE.draftSaleItems : [];
  if(STATE.saleCreateStep === 'preview'){ renderSaleCreatePreview(root); return; }
  const h = STATE.saleHeader || {};
  root.innerHTML = `
    <div class="card">
      <h2>บันทึกขายออกทรัพย์สิน</h2>
      <div class="row">
        <div>
          <label>หน่วยงานเจ้าของทรัพย์สิน</label>
          <select id="sFromDept"></select>
        </div>
        <div>
          <label>ผู้ซื้อ / ผู้ประมูลได้</label>
          <input type="text" id="sBuyer" placeholder="ชื่อผู้ซื้อ หรือ บริษัทผู้ประมูล" value="${esc(h.buyer||'')}">
        </div>
      </div>
      <label>หมายเหตุ</label>
      <textarea id="sRemark" placeholder="รายละเอียดเพิ่มเติมเกี่ยวกับการขายออก...">${esc(h.remark||'')}</textarea>
      <div class="row">
        <div>
          <label>ชื่อผู้บันทึก</label>
          <input type="text" id="sCreatedBy" value="${esc(h.createdBy||STATE.username||'')}">
        </div>
        <div>
          <label>อีเมลผู้บันทึก (สำหรับรับผลอนุมัติ)</label>
          <input type="email" id="sCreatedByEmail" value="${esc(h.createdByEmail||'')}">
        </div>
      </div>
      <div class="row">
        <div>
          <label>ชื่อผู้อนุมัติ (ผู้บริหาร)</label>
          <input type="text" id="sApproverName" placeholder="เช่น คุณสมชาย ผู้จัดการฝ่าย" value="${esc(h.approverName||'')}">
        </div>
        <div>
          <label>อีเมลผู้อนุมัติ *</label>
          <input type="email" id="sApproverEmail" placeholder="approver@company.com" value="${esc(h.approverEmail||'')}">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>รายการทรัพย์สินที่ขายออก</h2>
      <div class="autocomplete-wrap">
        <input type="text" id="saleAssetSearch" placeholder="ค้นหารหัส หรือ ชื่อทรัพย์สิน แล้วเลือกเพื่อเพิ่มรายการ...">
        <div id="saleAssetSuggest" class="autocomplete-list" style="display:none;"></div>
      </div>
      <div id="saleItemsHost" style="margin-top:14px;"></div>
      <div class="empty" id="saleItemsEmpty">ยังไม่มีรายการทรัพย์สิน — ค้นหาด้านบนเพื่อเพิ่ม</div>
      <div class="row" style="justify-content:flex-end;margin-top:10px;">
        <div style="max-width:320px;text-align:right;font-size:13px;color:var(--muted);">
          รวมราคาขาย: <b id="saleTotal" style="color:var(--navy);font-size:15px;">0.00</b> บาท
        </div>
      </div>
    </div>

    <div class="card no-print" style="text-align:right;">
      <button class="btn btn-primary" id="btnSubmitSale">ดูตัวอย่างก่อนบันทึก →</button>
    </div>
  `;

  loadDeptOptions();
  loadAssetsForSearch();
  renderSaleItems();

  document.getElementById('btnSubmitSale').onclick = goToSalePreview;

  function goToSalePreview(){
    if(!STATE.draftSaleItems.length){ toast('กรุณาเพิ่มรายการทรัพย์สินอย่างน้อย 1 รายการ','err'); return; }
    const fromDept = document.getElementById('sFromDept').value;
    const approverEmail = document.getElementById('sApproverEmail').value.trim();
    if(!deptSkipsApproval(fromDept) && !approverEmail){ toast('กรุณาระบุอีเมลผู้อนุมัติ','err'); return; }
    STATE.saleHeader = {
      fromDept,
      buyer: document.getElementById('sBuyer').value,
      remark: document.getElementById('sRemark').value,
      createdBy: document.getElementById('sCreatedBy').value,
      createdByEmail: document.getElementById('sCreatedByEmail').value,
      approverName: document.getElementById('sApproverName').value,
      approverEmail
    };
    STATE.saleCreateStep = 'preview';
    render();
  }

  function loadDeptOptions(){
    apiGet({action:'getDeptCodes'}).then(res=>{
      if(!res.ok){ toast(res.error,'err'); return; }
      STATE.deptCodes = res.data;
      const fromDepts = STATE.role==='admin' ? res.data : res.data.filter(d=>(STATE.myDepartments||[]).indexOf(d.DeptName)!==-1);
      const opts = '<option value="">-- เลือก --</option>' + fromDepts.map(d=>`<option value="${esc(d.DeptName)}">${esc(d.DeptName)} (${esc(d.Code)})</option>`).join('');
      document.getElementById('sFromDept').innerHTML = opts;
      document.getElementById('sFromDept').value = h.fromDept || '';
      document.getElementById('sFromDept').addEventListener('change', ()=>{
        const d = STATE.deptCodes.find(x=>x.DeptName===document.getElementById('sFromDept').value);
        if(d){
          if(d.ApproverName) document.getElementById('sApproverName').value = d.ApproverName;
          if(d.ApproverEmail) document.getElementById('sApproverEmail').value = d.ApproverEmail;
        }
      });
    });
  }

  function loadAssetsForSearch(){
    apiGet({action:'getAssets'}).then(res=>{ if(res.ok) STATE.assets = res.data; });
  }

  const searchInput = document.getElementById('saleAssetSearch');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    const suggestBox = document.getElementById('saleAssetSuggest');
    if(!q){ suggestBox.style.display='none'; return; }
    const usedIds = STATE.draftSaleItems.map(x=>x.assetId);
    const matches = STATE.assets.filter(a =>
      (String(a.AssetID).toLowerCase().includes(q) || String(a.AssetName).toLowerCase().includes(q)) && usedIds.indexOf(a.AssetID)===-1
    ).slice(0,15);
    if(!matches.length){ suggestBox.innerHTML = '<div class="autocomplete-item">ไม่พบรายการ</div>'; suggestBox.style.display='block'; return; }
    suggestBox.innerHTML = matches.map(a => `
      <div class="autocomplete-item" data-id="${esc(a.AssetID)}">
        <img class="thumb" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(a.DisplayImage||'')}')">
        <div><b>${esc(a.AssetID)}</b> — ${esc(a.AssetName)}<br><span style="color:var(--muted);font-size:11px;">${esc(a.Department)}</span></div>
      </div>`).join('');
    suggestBox.style.display='block';
    suggestBox.querySelectorAll('.autocomplete-item').forEach(el=>{
      el.onclick = ()=>{
        const asset = STATE.assets.find(a=>a.AssetID===el.dataset.id);
        addSaleItem(asset);
        searchInput.value='';
        suggestBox.style.display='none';
      };
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.autocomplete-wrap')) {
      const box = document.getElementById('saleAssetSuggest');
      if(box) box.style.display='none';
    }
  });

  function addSaleItem(asset){
    STATE.draftSaleItems.push({
      assetId: asset.AssetID,
      assetName: asset.AssetName,
      images: asset.DisplayImage ? [asset.DisplayImage] : [],
      scrapPrice: asset.ScrapPrice || '',
      auctionPrice: '',
      salePrice: asset.MinSalePrice || '',
      remark: ''
    });
    renderSaleItems();
  }

  function renderSaleItems(){
    const host = document.getElementById('saleItemsHost');
    const empty = document.getElementById('saleItemsEmpty');
    empty.style.display = STATE.draftSaleItems.length ? 'none':'block';
    host.innerHTML = STATE.draftSaleItems.map((it, i) => `
      <div class="item-line">
        <button class="del" onclick="removeSaleItem(${i})">✕</button>
        <div class="row">
          <div style="flex:0 0 auto;">
            <div class="item-img-gallery">
              ${(it.images||[]).map((url,gi)=>`
                <div class="item-img-thumb">
                  <img src="${esc(url)}" onerror="this.style.visibility='hidden'" style="cursor:zoom-in;" onclick="openImageLightbox('${esc(url)}')">
                  <button type="button" class="del-img" onclick="removeSaleItemImage(${i},${gi})">✕</button>
                </div>`).join('')}
              ${(it.images||[]).length < ITEM_IMAGE_LIMIT ? `
                <div class="item-img-add" onclick="document.getElementById('saleItemFile${i}').click()">+ เพิ่มรูป<br>(${(it.images||[]).length}/${ITEM_IMAGE_LIMIT})</div>
                <div class="item-img-add" onclick="document.getElementById('saleItemCam${i}').click()">📷 ถ่ายรูป</div>
              ` : ''}
            </div>
            <input type="file" id="saleItemFile${i}" accept="image/*" style="display:none;" onchange="uploadSaleItemImage(${i}, this)">
            <input type="file" id="saleItemCam${i}" accept="image/*" capture="environment" style="display:none;" onchange="uploadSaleItemImage(${i}, this)">
          </div>
          <div style="flex:2;">
            <b>${esc(it.assetId)}</b> — ${esc(it.assetName)}
            <div class="row" style="margin-top:8px;">
              <div>
                <label>ราคาซาก</label>
                <input type="text" inputmode="decimal" value="${esc(it.scrapPrice)}" onchange="updateSaleItemField(${i},'scrapPrice',this.value)">
              </div>
              <div>
                <label>ราคาประมูล</label>
                <input type="text" inputmode="decimal" value="${esc(it.auctionPrice)}" onchange="updateSaleItemField(${i},'auctionPrice',this.value)">
              </div>
              <div>
                <label>ราคาขาย</label>
                <input type="text" inputmode="decimal" value="${esc(it.salePrice)}" onchange="updateSaleItemField(${i},'salePrice',this.value)">
              </div>
            </div>
            <label style="margin-top:6px;">หมายเหตุ</label>
            <input type="text" value="${esc(it.remark)}" onchange="updateSaleItemField(${i},'remark',this.value)">
          </div>
        </div>
      </div>
    `).join('');
    updateSaleTotal();
  }

  function updateSaleTotal(){
    const total = STATE.draftSaleItems.reduce((sum,it)=> sum + (parseFloat(String(it.salePrice).replace(/,/g,''))||0), 0);
    const el = document.getElementById('saleTotal');
    if(el) el.textContent = fmtMoney(total);
  }

  window.removeSaleItem = (i)=>{ STATE.draftSaleItems.splice(i,1); renderSaleItems(); };
  window.updateSaleItemField = (i, field, val)=>{ STATE.draftSaleItems[i][field] = val; updateSaleTotal(); };
  window.removeSaleItemImage = (i, gi)=>{ STATE.draftSaleItems[i].images.splice(gi,1); renderSaleItems(); };
  window.uploadSaleItemImage = (i, input)=>{
    const file = input.files[0];
    if(!file) return;
    if(!STATE.draftSaleItems[i].images) STATE.draftSaleItems[i].images = [];
    if(STATE.draftSaleItems[i].images.length >= ITEM_IMAGE_LIMIT){ toast('เพิ่มรูปได้สูงสุด '+ITEM_IMAGE_LIMIT+' รูปต่อรายการ','err'); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      toast('กำลังอัปโหลดรูป...');
      apiPost({ action:'uploadImage', password: STATE.adminPassword, base64: reader.result, contentType: file.type, fileName: STATE.draftSaleItems[i].assetId })
        .then(res=>{
          if(res.ok){
            STATE.draftSaleItems[i].images.push(res.data.url);
            renderSaleItems();
            toast('อัปโหลดรูปสำเร็จ','ok');
          } else toast(res.error||'อัปโหลดไม่สำเร็จ','err');
        });
    };
    reader.readAsDataURL(file);
    input.value = '';
  };

}

function renderSaleCreatePreview(root){
  const h = STATE.saleHeader || {};
  const draftDoc = {
    RunningNo: '(จะออกเลขที่อัตโนมัติเมื่อบันทึก)',
    CreatedAt: new Date().toISOString(),
    FromDept: h.fromDept, Buyer: h.buyer, Remark: h.remark, Status: 'Draft',
    Items: STATE.draftSaleItems.map(it => ({
      AssetID: it.assetId, AssetName: it.assetName, Images: it.images,
      ScrapPrice: it.scrapPrice, AuctionPrice: it.auctionPrice, SalePrice: it.salePrice, Remark: it.remark
    }))
  };
  root.innerHTML = `
    <div class="toolbar no-print">
      <button class="btn btn-secondary btn-sm" id="btnSalePreviewBack">← กลับไปแก้ไข</button>
      <button class="btn btn-secondary btn-sm" id="btnSalePreviewPrint">🖨️ พิมพ์ตัวอย่าง</button>
      <button class="btn btn-primary btn-sm" id="btnSalePreviewConfirm" style="margin-left:auto;">✔ ยืนยันบันทึกและส่งอีเมลขออนุมัติ</button>
    </div>
    ${buildSaleDocHtml(draftDoc, false)}
  `;
  document.getElementById('btnSalePreviewBack').onclick = ()=>{ STATE.saleCreateStep='form'; render(); };
  document.getElementById('btnSalePreviewPrint').onclick = ()=> window.print();
  document.getElementById('btnSalePreviewConfirm').onclick = doSubmitSale;
}

function doSubmitSale(){
  const h = STATE.saleHeader;
  const payload = {
    action:'createSale',
    password: STATE.adminPassword,
    fromDept: h.fromDept, buyer: h.buyer, remark: h.remark,
    createdBy: h.createdBy, createdByEmail: h.createdByEmail,
    approverName: h.approverName, approverEmail: h.approverEmail,
    items: STATE.draftSaleItems
  };
  const btn = document.getElementById('btnSalePreviewConfirm');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
  apiPost(payload).then(res=>{
    if(!res.ok){
      btn.disabled = false; btn.innerHTML = '✔ ยืนยันบันทึกและส่งอีเมลขออนุมัติ';
      toast(res.error||'บันทึกไม่สำเร็จ','err');
      return;
    }
    toast('สร้างใบขายออก '+res.data.runningNo+' สำเร็จ '+(res.data.autoApproved ? 'อนุมัติอัตโนมัติ (หน่วยงานนี้ไม่ต้องขออนุมัติ)' : 'ส่งอีเมลขออนุมัติแล้ว'),'ok');
    const submittedSaleAssetIds = STATE.draftSaleItems.map(it=>it.assetId);
    if(submittedSaleAssetIds.length) apiPost({ action:'removeFromSaleQueue', assetIds: submittedSaleAssetIds });
    STATE.selectedSaleQueueAssetIds = STATE.selectedSaleQueueAssetIds.filter(id=>submittedSaleAssetIds.indexOf(id)===-1);
    STATE.draftSaleItems = [];
    STATE.saleHeader = null;
    STATE.saleCreateStep = 'form';
    STATE.view = 'salePrint';
    STATE.printSaleId = res.data.saleId;
    render();
  });
}

  function loadWriteOffQueue(){
    document.getElementById('writeOffQueueTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet({action:'getWriteOffQueue'}).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดคิวไม่สำเร็จ','err'); return; }
      STATE.writeOffQueue = deptFilterRows(res.data, ['Department']);

      renderWriteOffQueueTable();
    });

  function renderWriteOffQueueTable(){
    const host = document.getElementById('writeOffQueueTableHost');
    if(!STATE.writeOffQueue.length){ host.innerHTML = '<div class="empty">ยังไม่มีรายการรอตัดชำรุด — เพิ่มได้จากหน้า "รายการทรัพย์สิน"</div>'; updateWriteOffQueueSelCount(); return; }
    const qq = (document.getElementById('woQSearch').value||'').trim().toLowerCase();
    const rows = qq ? STATE.writeOffQueue.filter(r => String(r.AssetID).toLowerCase().indexOf(qq)!==-1 || String(r.AssetName).toLowerCase().indexOf(qq)!==-1) : STATE.writeOffQueue;
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่พบทรัพย์สินที่ค้นหา</div>'; updateWriteOffQueueSelCount(); return; }
    const selectableRows = rows.filter(q=>(q.AssetStatus||'Active')==='Active');
    const allSelected = selectableRows.length>0 && selectableRows.every(q=>STATE.selectedWriteOffQueueAssetIds.indexOf(q.AssetID)!==-1);
    let html = `<div style="overflow-x:auto;"><table><tr><th class="no-print"><input type="checkbox" id="writeOffQueueSelectAll" ${allSelected?'checked':''}></th><th>รูป</th><th>รหัส</th><th>ชื่อทรัพย์สิน</th><th>หน่วยงาน</th><th>ราคาซาก</th><th>เพิ่มโดย</th><th>เมื่อ</th><th class="no-print">จัดการ</th></tr>`;
    rows.forEach(q=>{
      const disabled = (q.AssetStatus||'Active')!=='Active';
      const checked = STATE.selectedWriteOffQueueAssetIds.indexOf(q.AssetID)!==-1 ? 'checked' : '';
      html += `<tr>
        <td class="no-print"><input type="checkbox" class="writeOffQueueRowChk" data-id="${esc(q.AssetID)}" ${checked} ${disabled?'disabled':''}></td>
        <td><img class="thumb" src="${esc(q.DisplayImage||'')}" onerror="this.style.visibility='hidden'" onclick="openImageLightbox('${esc(q.DisplayImage||'')}')"></td>
        <td><b>${esc(q.AssetID)}</b></td>
        <td>${esc(q.AssetName)}${disabled?' <span class="badge badge-rejected">ไม่ว่างแล้ว</span>':''}</td>
        <td>${esc(q.Department)}</td>
        <td class="money">${fmtMoneyOrHidden(q.ScrapPrice)}</td>
        <td>${esc(q.AddedBy||'-')}</td>
        <td>${fmtDate(q.AddedAt)}</td>
        <td class="no-print"><button class="btn btn-red btn-sm" data-unqueueid="${esc(q.AssetID)}">เอาออก</button></td>
      </tr>`;
    });
    html += '</table></div>';
    host.innerHTML = html;

    document.getElementById('writeOffQueueSelectAll').onchange = (e)=>{
      const ids = rows.filter(q=>(q.AssetStatus||'Active')==='Active').map(q=>q.AssetID);
      if(e.target.checked){ ids.forEach(id=>{ if(STATE.selectedWriteOffQueueAssetIds.indexOf(id)===-1) STATE.selectedWriteOffQueueAssetIds.push(id); }); }
      else { STATE.selectedWriteOffQueueAssetIds = STATE.selectedWriteOffQueueAssetIds.filter(id=>ids.indexOf(id)===-1); }
      renderWriteOffQueueTable();
    };
    host.querySelectorAll('.writeOffQueueRowChk').forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.id;
        if(chk.checked){ if(STATE.selectedWriteOffQueueAssetIds.indexOf(id)===-1) STATE.selectedWriteOffQueueAssetIds.push(id); }
        else { STATE.selectedWriteOffQueueAssetIds = STATE.selectedWriteOffQueueAssetIds.filter(x=>x!==id); }
        updateWriteOffQueueSelCount();
      };
    });
    makeRowsClickable(host, 'writeOffQueueRowChk');
    host.querySelectorAll('[data-unqueueid]').forEach(btn=>{
      btn.onclick = ()=>{
        const assetId = btn.dataset.unqueueid;
        apiPost({ action:'removeFromWriteOffQueue', assetIds:[assetId] }).then(res=>{
          if(!res.ok){ toast(res.error||'เอาออกจากคิวไม่สำเร็จ','err'); return; }
          STATE.selectedWriteOffQueueAssetIds = STATE.selectedWriteOffQueueAssetIds.filter(x=>x!==assetId);
          loadWriteOffQueue();
        });
      };
    });
    updateWriteOffQueueSelCount();
  }

  function updateWriteOffQueueSelCount(){
    const el = document.getElementById('writeOffQueueSelCount');
    if(el) el.textContent = 'เลือกไว้ '+STATE.selectedWriteOffQueueAssetIds.length+' รายการ';
  }

  function createWriteOffFromQueue(){
    const selected = STATE.writeOffQueue.filter(q => STATE.selectedWriteOffQueueAssetIds.indexOf(q.AssetID)!==-1 && (q.AssetStatus||'Active')==='Active');
    if(!selected.length){ toast('กรุณาเลือกรายการจากคิวอย่างน้อย 1 รายการ','err'); return; }
    STATE.draftWriteOffItems = selected.map(q => ({
      assetId: q.AssetID, assetName: q.AssetName, images: q.DisplayImage ? [q.DisplayImage] : [],
      scrapPrice: q.ScrapPrice||'', remark:''
    }));
    STATE.view = 'writeOffCreate';
    render();
  }

  function exportWoList(){
    if(!STATE.writeOffs.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const header = ['เลขที่','วันที่','หน่วยงาน','สาเหตุ','จำนวนรายการ','สถานะ','ผู้อนุมัติ','ลิงก์รูปภาพ'];
    const dataRows = STATE.writeOffs.map(w => [
      w.RunningNo, fmtDate(w.CreatedAt), w.FromDept, w.Reason||'', w.ItemCount,
      STATUS_LABELS[w.Status]||w.Status, w.ApproverName||w.ApproverEmail||'', w.AllImages||''
    ]);
    exportExcel('รายการตัดชำรุด.xlsx', [{ name:'ตัดชำรุด', header, rows: dataRows }]);
  }

  function loadWoList(){
    const params = { action:'getWriteOffs' };
    const q = document.getElementById('fWoSearch').value.trim();
    const status = document.getElementById('fWoStatus').value;
    const from = document.getElementById('fWoFrom').value;
    const to = document.getElementById('fWoTo').value;
    if(q) params.q = q;
    if(status) params.status = status;

    if(to) params.to = to;
    document.getElementById('woListTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';

      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.writeOffs = deptFilterRows(res.data, ['FromDept']);
      renderWoListTable();
    });

  function renderWoListTable(){
    const host = document.getElementById('woListTableHost');
    document.getElementById('woListCount').textContent = 'รวม '+STATE.writeOffs.length+' รายการ';
    if(!STATE.writeOffs.length){ host.innerHTML = '<div class="empty">ยังไม่มีรายการตัดชำรุด</div>'; return; }
    let html = '<table><tr><th>เลขที่</th><th>วันที่</th><th>หน่วยงาน</th><th>สาเหตุ</th><th>จำนวนรายการ</th><th>สถานะ</th><th>ผู้อนุมัติ</th><th class="no-print">การจัดการ</th></tr>';
    STATE.writeOffs.forEach(w=>{
      html += `<tr>
        <td><b>${esc(w.RunningNo)}</b></td>
        <td>${fmtDate(w.CreatedAt)}</td>
        <td>${esc(w.FromDept)}</td>
        <td>${esc(w.Reason||'-')}</td>
        <td style="text-align:center;">${w.ItemCount}</td>
        <td>${statusBadge(w.Status)}</td>
        <td>${esc(w.ApproverName||w.ApproverEmail||'-')}</td>
        <td class="no-print">
          <button class="btn btn-secondary btn-sm" onclick="openWriteOffPrint('${w.WriteOffID}')">ดู/พิมพ์</button>
          ${w.Status==='Approved' ? `<button class="btn btn-secondary btn-sm" onclick="sendNotifyEmail('writeoff','${w.WriteOffID}',this)">📧 ${w.NotifiedAt?'ส่งซ้ำ':'แจ้งบัญชี/GA'}</button>
          <div style="font-size:11px;color:${w.NotifiedAt?'var(--green)':'var(--muted)'};margin-top:2px;">${w.NotifiedAt?('✅ ส่งแล้ว '+fmtDate(w.NotifiedAt)):'ยังไม่ส่ง'}</div>` : ''}
        </td>
      </tr>`;
    });
    html += '</table>';
    host.innerHTML = html;
  }
}

      const opts = '<option value="">-- เลือก --</option>' + fromDepts.map(d=>`<option value="${esc(d.DeptName)}">${esc(d.DeptName)} (${esc(d.Code)})</option>`).join('');

    const usedIds = STATE.draftWriteOffItems.map(x=>x.assetId);
    const matches = STATE.assets.filter(a =>
      (String(a.AssetID).toLowerCase().includes(q) || String(a.AssetName).toLowerCase().includes(q)) && usedIds.indexOf(a.AssetID)===-1

      scrapPrice: asset.ScrapPrice || '', remark: ''
    });

              ${(it.images||[]).length < ITEM_IMAGE_LIMIT ? `
                <div class="item-img-add" onclick="document.getElementById('woItemFile${i}').click()">+ เพิ่มรูป<br>(${(it.images||[]).length}/${ITEM_IMAGE_LIMIT})</div>
                <div class="item-img-add" onclick="document.getElementById('woItemCam${i}').click()">📷 ถ่ายรูป</div>
              ` : ''}
            </div>
            <input type="file" id="woItemFile${i}" accept="image/*" style="display:none;" onchange="uploadWoItemImage(${i}, this)">
            <input type="file" id="woItemCam${i}" accept="image/*" capture="environment" style="display:none;" onchange="uploadWoItemImage(${i}, this)">
          </div>
          <div style="flex:2;">
            <b>${esc(it.assetId)}</b> — ${esc(it.assetName)}
            <label style="margin-top:6px;">ราคาซาก</label>
            <input type="text" inputmode="decimal" value="${esc(it.scrapPrice)}" onchange="updateWoItemField(${i},'scrapPrice',this.value)">
            <label style="margin-top:6px;">หมายเหตุ</label>
            <input type="text" value="${esc(it.remark)}" onchange="updateWoItemField(${i},'remark',this.value)">
          </div>
        </div>
      </div>
    `).join('');
  }

  window.removeWoItem = (i)=>{ STATE.draftWriteOffItems.splice(i,1); renderWoItems(); };
  window.updateWoItemField = (i, field, val)=>{ STATE.draftWriteOffItems[i][field] = val; };
  window.removeWoItemImage = (i, gi)=>{ STATE.draftWriteOffItems[i].images.splice(gi,1); renderWoItems(); };
  window.uploadWoItemImage = (i, input)=>{
    const file = input.files[0];
    if(!file) return;
    if(!STATE.draftWriteOffItems[i].images) STATE.draftWriteOffItems[i].images = [];
    if(STATE.draftWriteOffItems[i].images.length >= ITEM_IMAGE_LIMIT){ toast('เพิ่มรูปได้สูงสุด '+ITEM_IMAGE_LIMIT+' รูปต่อรายการ','err'); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      toast('กำลังอัปโหลดรูป...');
      apiPost({ action:'uploadImage', password: STATE.adminPassword, base64: reader.result, contentType: file.type, fileName: STATE.draftWriteOffItems[i].assetId })
        .then(res=>{
          if(res.ok){
            STATE.draftWriteOffItems[i].images.push(res.data.url);
            renderWoItems();
            toast('อัปโหลดรูปสำเร็จ','ok');
          } else toast(res.error||'อัปโหลดไม่สำเร็จ','err');
        });
    };
    reader.readAsDataURL(file);
    input.value = '';
  };

}

function doSubmitWriteOff(){
  const h = STATE.writeOffHeader;
  const payload = {
    action:'createWriteOff',
    password: STATE.adminPassword,
    fromDept: h.fromDept, reason: h.reason, remark: h.remark,
    createdBy: h.createdBy, createdByEmail: h.createdByEmail,
    approverName: h.approverName, approverEmail: h.approverEmail,
    items: STATE.draftWriteOffItems
  };
  const btn = document.getElementById('btnWoPreviewConfirm');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
  apiPost(payload).then(res=>{
    if(!res.ok){
      btn.disabled = false; btn.innerHTML = '✔ ยืนยันบันทึกและส่งอีเมลขออนุมัติ';
      toast(res.error||'บันทึกไม่สำเร็จ','err');
      return;
    }
    toast('สร้างใบตัดชำรุด '+res.data.runningNo+' สำเร็จ '+(res.data.autoApproved ? 'อนุมัติอัตโนมัติ (หน่วยงานนี้ไม่ต้องขออนุมัติ)' : 'ส่งอีเมลขออนุมัติแล้ว'),'ok');
    const submittedWoAssetIds = STATE.draftWriteOffItems.map(it=>it.assetId);
    if(submittedWoAssetIds.length) apiPost({ action:'removeFromWriteOffQueue', assetIds: submittedWoAssetIds });
    STATE.selectedWriteOffQueueAssetIds = STATE.selectedWriteOffQueueAssetIds.filter(id=>submittedWoAssetIds.indexOf(id)===-1);
    STATE.draftWriteOffItems = [];
    STATE.writeOffHeader = null;
    STATE.writeOffCreateStep = 'form';
    STATE.view = 'writeOffPrint';
    STATE.printWriteOffId = res.data.writeOffId;
    render();
  });
}

/* ================= ACTIVITY LOG VIEW (Admin) ================= */
function renderActivityLog(root){
  root.innerHTML = `
    <div class="card">
      <h2>ประวัติการใช้งาน</h2>
      <p style="color:var(--muted);font-size:13px;">บันทึกการเข้าสู่ระบบและการเปลี่ยนแปลงข้อมูลทั้งหมดในระบบ เรียงล่าสุดก่อน (แสดงสูงสุด 300 รายการล่าสุดตามตัวกรอง)</p>
      <div class="toolbar no-print">
        <input type="text" id="alogSearch" placeholder="ค้นหาผู้ใช้ / การกระทำ / รายละเอียด..." style="max-width:240px;">
        <input type="date" id="alogFrom" style="max-width:150px;">
        <input type="date" id="alogTo" style="max-width:150px;">
        <button class="btn btn-secondary btn-sm" id="btnAlogFilter">กรอง</button>
        <button class="btn btn-secondary btn-sm" id="btnAlogRefresh">↻ รีเฟรช</button>
        <span id="alogCount" style="font-size:13px;color:var(--muted);margin-left:auto;">รวม 0 รายการ</span>
        <button class="btn btn-secondary btn-sm" id="btnAlogExport">⬇ Export Excel</button>
      </div>
      <div id="alogTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;

  let currentRows = [];

  document.getElementById('btnAlogFilter').onclick = loadActivityLog;
  document.getElementById('btnAlogRefresh').onclick = loadActivityLog;
  document.getElementById('btnAlogExport').onclick = exportActivityLog;

  function loadActivityLog(){
    const host = document.getElementById('alogTableHost');
    host.innerHTML = '<div class="empty">กำลังโหลด...</div>';
    const payload = {
      action: 'adminGetActivityLog',
      password: STATE.adminPassword,
      q: document.getElementById('alogSearch').value.trim(),
      from: document.getElementById('alogFrom').value,
      to: document.getElementById('alogTo').value
    };
    apiPost(payload).then(res=>{
      if(!res.ok){ host.innerHTML = 'โหลดไม่สำเร็จ: '+esc(res.error||''); return; }
      currentRows = res.data.rows || [];
      const shown = currentRows.length;
      const total = res.data.total || 0;
      document.getElementById('alogCount').textContent = total > shown
        ? `แสดง ${shown} จากทั้งหมด ${total} รายการ (ปรับตัวกรองให้แคบลงเพื่อดูรายการเก่ากว่านี้)`
        : `รวม ${total} รายการ`;
      if(!currentRows.length){ host.innerHTML = '<div class="empty">ไม่มีข้อมูล</div>'; return; }
      host.innerHTML = `<div style="overflow-x:auto;"><table><tr><th>เวลา</th><th>ทำโดย</th><th>การกระทำ</th><th>รายละเอียด</th><th>เอกสารที่เกี่ยวข้อง</th></tr>` +
        currentRows.map(r => `<tr><td>${esc(fmtDate(r.Timestamp))}</td><td>${esc(r.By||'')}</td><td>${esc(r.Action||'')}</td><td>${esc(r.Detail||'')}</td><td>${esc(r.TransferID||'')}</td></tr>`).join('') +
        `</table></div>`;
    });
  }

  function exportActivityLog(){
    if(!currentRows.length){ toast('ไม่มีข้อมูลให้ export','err'); return; }
    const header = ['เวลา','ทำโดย','การกระทำ','รายละเอียด','เอกสารที่เกี่ยวข้อง'];
    const rows = currentRows.map(r => [fmtDate(r.Timestamp), r.By||'', r.Action||'', r.Detail||'', r.TransferID||'']);
    exportExcel('ประวัติการใช้งาน.xlsx', [{ name:'ประวัติการใช้งาน', header, rows }]);
  }

  loadActivityLog();
}

        <td><input type="text" data-dfield="ApproverName" data-di="${i}" value="${esc(d.ApproverName||'')}" placeholder="เช่น คุณสมชาย ผู้จัดการฝ่าย"></td>
        <td><input type="email" data-dfield="ApproverEmail" data-di="${i}" value="${esc(d.ApproverEmail||'')}" placeholder="approver@company.com"></td>
        <td style="text-align:center;"><input type="checkbox" data-dfield="RequireApproval" data-di="${i}" ${d.SkipApprovalEmail ? '' : 'checked'}></td>
        <td><input type="number" min="1" data-dfield="StartSeqTransfer" data-di="${i}" value="${esc(d.StartSeqTransfer||'')}" placeholder="1" style="max-width:70px;"></td>
        <td><input type="number" min="1" data-dfield="StartSeqSale" data-di="${i}" value="${esc(d.StartSeqSale||'')}" placeholder="1" style="max-width:70px;"></td>
        <td><input type="number" min="1" data-dfield="StartSeqWriteOff" data-di="${i}" value="${esc(d.StartSeqWriteOff||'')}" placeholder="1" style="max-width:70px;"></td>
        <td class="no-print" style="white-space:nowrap;">
          <button class="btn btn-secondary btn-sm" onclick="saveDeptRow(${i})">บันทึก</button>
          <button class="btn btn-red btn-sm" onclick="deleteDeptRow(${i})">ลบ</button>
        </td>
      </tr>`).join('');
    document.getElementById('deptTableHost').innerHTML = `
      <div style="overflow-x:auto;"><table>
        <tr>
          <th>หน่วยงาน</th><th>รหัส</th><th>ชื่อผู้อนุมัติ</th><th>อีเมลผู้อนุมัติ</th>
          <th>ต้องส่งอีเมล<br>ขออนุมัติ</th><th>เลขเริ่มต้น<br>โอนย้าย</th><th>เลขเริ่มต้น<br>ขายออก</th><th>เลขเริ่มต้น<br>ตัดชำรุด</th>
          <th class="no-print">จัดการ</th>
        </tr>
        ${rowsHtml || '<tr><td colspan="9" class="empty">ยังไม่มีหน่วยงาน</td></tr>'}
      </table></div>
      <p style="color:var(--muted);font-size:12px;margin-top:8px;">"เลขเริ่มต้น" คือเลขลำดับที่ต้องการให้เอกสารถัดไปของหน่วยงานนี้เริ่มออกจากเลขนี้เป็นต้นไป (เว้นว่าง = เริ่มที่ 1 ตามปกติ) ถ้ามีเอกสารออกไปแล้วเลขสูงกว่าที่กำหนด ระบบจะออกเลขต่อจากเลขสูงสุดที่มีอยู่แทน</p>
    `;
  }

  function addBlankDeptRow(){
    STATE.deptCodes.push({ DeptName:'', Code:'', ApproverName:'', ApproverEmail:'', SkipApprovalEmail:false, StartSeqTransfer:'', StartSeqSale:'', StartSeqWriteOff:'', __isNew:true });
    renderDeptTable();
  }

  window.saveDeptRow = (i)=>{
    const d = STATE.deptCodes[i];
    ['DeptName','Code','ApproverName','ApproverEmail'].forEach(f=>{
      const el = document.querySelector(`[data-dfield="${f}"][data-di="${i}"]`);
      if(el) d[f] = el.value.trim();
    });
    const reqEl = document.querySelector(`[data-dfield="RequireApproval"][data-di="${i}"]`);
    d.SkipApprovalEmail = reqEl ? !reqEl.checked : false;
    ['StartSeqTransfer','StartSeqSale','StartSeqWriteOff'].forEach(f=>{
      const el = document.querySelector(`[data-dfield="${f}"][data-di="${i}"]`);
      d[f] = el ? el.value.trim() : '';
    });
    if(!d.DeptName || !d.Code){ toast('กรุณาระบุชื่อหน่วยงานและรหัส','err'); return; }
    apiPost({ action:'adminSaveDept', password: STATE.adminPassword, dept: d }).then(res=>{
      if(!res.ok){ toast(res.error||'บันทึกหน่วยงานไม่สำเร็จ','err'); return; }
      toast('บันทึกหน่วยงานสำเร็จ','ok');
      loadDeptCodes();
    });
  };

  window.deleteDeptRow = (i)=>{
    const d = STATE.deptCodes[i];
    if(d.__isNew){ STATE.deptCodes.splice(i,1); renderDeptTable(); return; }
    if(!confirm('ยืนยันลบหน่วยงาน "'+d.DeptName+'" ?')) return;
    apiPost({ action:'adminDeleteDept', password: STATE.adminPassword, deptName: d.DeptName }).then(res=>{
      if(!res.ok){ toast(res.error||'ลบหน่วยงานไม่สำเร็จ','err'); return; }
      toast('ลบหน่วยงานสำเร็จ','ok');
      loadDeptCodes();
    });
  };

  function loadSourceLink(){
    apiPost({ action:'adminGetSettings', password: STATE.adminPassword }).then(res=>{
      if(!res.ok) return;
      document.getElementById('sourceSheetUrl').value = res.data.sourceSheetUrl || '';
      document.getElementById('accountingEmail').value = res.data.accountingEmail || '';
      document.getElementById('gaEmail').value = res.data.gaEmail || '';
    });
  }

  function saveNotifyEmails(){
    const accountingEmail = document.getElementById('accountingEmail').value.trim();
    const gaEmail = document.getElementById('gaEmail').value.trim();
    const btn = document.getElementById('btnSaveNotifyEmails');
    btn.disabled = true;
    apiPost({ action:'adminSaveNotifyEmails', password: STATE.adminPassword, accountingEmail, gaEmail }).then(res=>{
      btn.disabled = false;
      if(!res.ok){ toast(res.error||'บันทึกอีเมลไม่สำเร็จ','err'); return; }
      toast('บันทึกอีเมลแจ้งเตือนสำเร็จ','ok');
    });
  }

  function saveSourceLink(){
    const url = document.getElementById('sourceSheetUrl').value.trim();
    const btn = document.getElementById('btnSaveSourceLink');
    btn.disabled = true;
    apiPost({ action:'adminSaveSourceSheetLink', password: STATE.adminPassword, url }).then(res=>{
      btn.disabled = false;
      if(!res.ok){ toast(res.error||'บันทึกลิงก์ไม่สำเร็จ','err'); return; }
      toast('บันทึกลิงก์สำเร็จ','ok');
    });
  }


  function syncSource(){
    const btn = document.getElementById('btnSyncSource');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังดึงข้อมูล...';
    apiPost({ action:'adminSyncFromSource', password: STATE.adminPassword }).then(res=>{
      btn.disabled = false; btn.innerHTML = '↻ ดึงข้อมูลล่าสุด';
      if(!res.ok){ toast(res.error||'ดึงข้อมูลไม่สำเร็จ','err'); return; }
      toast('ดึงข้อมูลจาก '+esc(res.data.sourceTabName||'')+' สำเร็จ พบข้อมูลใหม่ '+res.data.addedCount+' รายการ พบไม่ตรงกับบัญชี '+res.data.mismatchCount+' รายการ (ไม่ได้อัปเดตค่าอัตโนมัติ) — ดูรายละเอียด/ตรวจสอบได้ที่หน้า "รายการทรัพย์สิน"','ok');
    });
  }

  let userList = [];

  function loadUsers(){
    apiPost({ action:'adminGetUsers', password: STATE.adminPassword }).then(res=>{
      if(!res.ok){ document.getElementById('userTableHost').innerHTML = 'โหลดไม่สำเร็จ: '+res.error; return; }
      userList = res.data;
      renderUsersTable();
    });
  }

  function renderUsersTable(){
    const rowsHtml = userList.map((u,i)=>{
      const depts = u.Departments || [];
      const isAdmin = u.Role==='admin';
      const isExecutive = u.Role==='executive';
      const seesAllNoEdit = isAdmin || isExecutive; // ทั้ง Admin และผู้บริหารไม่ต้องกำหนดหน่วยงาน/เห็นราคาเสมอ
      return `
      <tr>
        <td><input type="text" data-ufield="Username" data-ui="${i}" value="${esc(u.Username)}" ${u.__isNew ? '' : 'readonly style="background:#f4f6f9;"'}></td>
        <td>
          <select data-ufield="Role" data-ui="${i}" onchange="toggleUserDeptSelect(${i})">
            <option value="user" ${(!isAdmin&&!isExecutive)?'selected':''}>User</option>
            <option value="executive" ${isExecutive?'selected':''}>ผู้บริหาร (ดูอย่างเดียว)</option>
            <option value="admin" ${isAdmin?'selected':''}>Admin</option>
          </select>
        </td>
        <td>
          <select data-ufield="Departments" data-ui="${i}" multiple size="4" style="min-width:160px;" ${seesAllNoEdit?'disabled':''}>
            ${STATE.deptCodes.map(d=>`<option value="${esc(d.DeptName)}" ${depts.indexOf(d.DeptName)!==-1?'selected':''}>${esc(d.DeptName)}</option>`).join('')}
          </select>
          <div style="font-size:11px;color:var(--muted);">${seesAllNoEdit ? (isAdmin?'Admin ไม่จำกัดหน่วยงาน':'ผู้บริหารเห็นทุกหน่วยงาน') : 'กด Ctrl/Cmd ค้างเพื่อเลือกหลายหน่วยงาน'}</div>
        </td>
        <td><input type="password" data-ufield="Password" data-ui="${i}" placeholder="${u.__isNew ? 'ระบุรหัสผ่าน' : 'เว้นว่าง = ไม่เปลี่ยน'}"></td>
        <td style="text-align:center;">
          <input type="checkbox" data-ufield="CanViewPrices" data-ui="${i}" ${u.CanViewPrices?'checked':''} ${seesAllNoEdit?'disabled':''}>
          ${seesAllNoEdit ? '<div style="font-size:11px;color:var(--muted);">เห็นเสมอ</div>' : ''}
        </td>
        <td class="no-print" style="white-space:nowrap;">
          <button class="btn btn-secondary btn-sm" onclick="saveUserRow(${i})">บันทึก</button>
          <button class="btn btn-red btn-sm" onclick="deleteUserRow(${i})">ลบ</button>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('userTableHost').innerHTML = `
      <div style="overflow-x:auto;"><table>
        <tr><th>ชื่อผู้ใช้</th><th>สิทธิ์</th><th>หน่วยงานที่ดูแล</th><th>รหัสผ่าน</th><th>ดูราคาซาก/มูลค่าตามบัญชีได้</th><th class="no-print">จัดการ</th></tr>
        ${rowsHtml || '<tr><td colspan="6" class="empty">ยังไม่มีผู้ใช้ — ต้องเพิ่มผู้ใช้ระดับ Admin อย่างน้อย 1 คน ไม่เช่นนั้นจะเข้าระบบไม่ได้เลย</td></tr>'}
      </table></div>
    `;
  }

  window.toggleUserDeptSelect = (i)=>{
    const roleEl = document.querySelector(`[data-ufield="Role"][data-ui="${i}"]`);
    const deptEl = document.querySelector(`[data-ufield="Departments"][data-ui="${i}"]`);
    if(deptEl) deptEl.disabled = (roleEl.value === 'admin' || roleEl.value === 'executive');
  };

  function addBlankUserRow(){
    userList.push({ Username:'', Role:'user', Departments:[], CanViewPrices:false, __isNew:true });
    renderUsersTable();
  }

  window.saveUserRow = (i)=>{
    const u = userList[i];
    const usernameEl = document.querySelector(`[data-ufield="Username"][data-ui="${i}"]`);
    const roleEl = document.querySelector(`[data-ufield="Role"][data-ui="${i}"]`);
    const deptEl = document.querySelector(`[data-ufield="Departments"][data-ui="${i}"]`);
    const pwEl = document.querySelector(`[data-ufield="Password"][data-ui="${i}"]`);
    const canViewPricesEl = document.querySelector(`[data-ufield="CanViewPrices"][data-ui="${i}"]`);
    u.Username = usernameEl.value.trim();
    u.Role = roleEl.value;
    u.Departments = Array.from(deptEl.selectedOptions).map(o=>o.value);
    u.CanViewPrices = canViewPricesEl.checked;
    const password = pwEl.value;
    if(!u.Username){ toast('กรุณาระบุชื่อผู้ใช้','err'); return; }
    apiPost({ action:'adminSaveUser', password: STATE.adminPassword, user: { Username: u.Username, Role: u.Role, Departments: u.Departments, CanViewPrices: u.CanViewPrices, Password: password } }).then(res=>{
      if(!res.ok){ toast(res.error||'บันทึกผู้ใช้ไม่สำเร็จ','err'); return; }
      toast('บันทึกผู้ใช้สำเร็จ','ok');
      loadUsers();
    });
  };

  window.deleteUserRow = (i)=>{
    const u = userList[i];
    if(u.__isNew){ userList.splice(i,1); renderUsersTable(); return; }
    if(!confirm('ยืนยันลบผู้ใช้ "'+u.Username+'" ?')) return;
    apiPost({ action:'adminDeleteUser', password: STATE.adminPassword, username: u.Username }).then(res=>{
      if(!res.ok){ toast(res.error||'ลบผู้ใช้ไม่สำเร็จ','err'); return; }
      toast('ลบผู้ใช้สำเร็จ','ok');
      loadUsers();
    });
  };
}

/* ================= PRINT VIEW ================= */
function renderPrint(root){
  root.innerHTML = `<div class="empty">กำลังโหลด...</div>`;
  apiGet({action:'getTransfer', id: STATE.printId}).then(res=>{
    if(!res.ok || !res.data){ root.innerHTML = '<div class="empty">ไม่พบใบโอนย้ายนี้</div>'; return; }
    STATE.currentTransfer = res.data;
    root.innerHTML = buildDocHtml(res.data, true);
    const btn = document.getElementById('btnPrintNow');
    if(btn) btn.onclick = ()=> window.print();
  });
}

function buildDocHtml(t, withToolbar){
  const itemsRows = (t.Items||[]).map((it, i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${docImgGallery(it.Images)}</td>
      <td>${esc(it.AssetID)}</td>
      <td class="left">${esc(it.AssetName)}</td>
      <td>${esc(it.FromDeptName)}<br><span style="font-size:11px;color:#666;">${esc(it.FromSignName)}</span></td>
      <td>${esc(it.ToDeptName)}<br><span style="font-size:11px;color:#666;">${esc(it.ToSignName)}</span></td>
      <td>${esc(it.Remark)}</td>
    </tr>`).join('');

  return `
    ${withToolbar ? `
    <div class="toolbar no-print">
      <button class="btn btn-secondary btn-sm" onclick="STATE.view='list';render();">← กลับรายการ</button>
      <button class="btn btn-primary btn-sm" id="btnPrintNow">🖨️ พิมพ์ / บันทึก PDF</button>
      <span style="margin-left:auto;">${statusBadge(t.Status)}</span>
    </div>` : ''}
    <div class="card" id="printArea">
      <div class="doc">
        <div class="doc-header">${esc(COMPANY_NAME)}</div>
        <div class="doc-title">ใบโอนย้ายทรัพย์สิน</div>
        <div class="doc-meta">
          <div><b>เลขที่</b> ${esc(t.RunningNo)}</div>
          <div><b>วันที่</b> ${fmtDate(t.CreatedAt)}</div>
        </div>
        <div class="doc-field"><b>เรียน</b> ผช.ผู้จัดการส่วนบัญชีและการเงิน ทราบ</div>
        <div class="doc-field"><b>เรื่อง</b> ${t.Subject==='อื่นๆ' ? 'อื่นๆ ('+esc(t.SubjectOther)+')' : 'โอนย้าย'}</div>
        <div class="doc-field"><b>เพื่อ</b> ${esc(t.Purpose||'-')}</div>
        <div class="doc-field">ดังมีรายละเอียดดังนี้ &nbsp; <b>จาก</b> ${esc(t.FromDept)} &nbsp; <b>ไปยัง</b> ${esc(t.ToDept)}</div>

        <table class="doc-table">
          <tr><th style="width:5%;">ลำดับ</th><th style="width:15%;">รูปภาพ</th><th style="width:10%;">รหัส</th><th style="width:25%;">รายการ</th><th style="width:15%;">ผู้โอน<br>หน่วยงาน/ผู้ลงชื่อ</th><th style="width:15%;">ผู้รับโอน<br>หน่วยงาน/ผู้ลงชื่อ</th><th style="width:15%;">หมายเหตุ</th></tr>
          ${itemsRows}
        </table>

        <div class="doc-note">
          หมายเหตุ : กรุณากำหนดเลขที่ running number ดังนี้ xxx/001/yy<br>
          xxx หมายถึง หน่วยงาน (ดูรหัสได้ที่เมนู "ตั้งค่ารหัสหน่วยงาน") &nbsp; 001 หมายถึง ลำดับเลขที่เอกสาร &nbsp; yy หมายถึง ปี พ.ศ. 2 หลัก
        </div>

        <div class="doc-sign">
          <div>
            <div class="line"></div>
            (ผู้โอน) ${esc((t.Items&&t.Items[0]&&t.Items[0].FromSignName)||'')}<br>
            วันที่ <span class="dateline"></span>
          </div>
          <div>
            <div class="line"></div>
            (ผู้รับโอน) ${esc((t.Items&&t.Items[0]&&t.Items[0].ToSignName)||'')}<br>
            วันที่ <span class="dateline"></span>
          </div>
        </div>

        <div style="margin-top:26px;font-size:13px;">
          <b>รับทราบโดย</b><br>
          1. ผจก.ฝ่าย/ผจก.ส่วน (โอน) &nbsp;&nbsp; วันที่ <span class="dateline"></span><br>
          2. ผจก.ฝ่าย/ผจก.ส่วน (รับโอน) &nbsp;&nbsp; วันที่ <span class="dateline"></span>
        </div>

        ${t.Status !== 'Draft' ? `
        <div style="margin-top:20px;padding-top:14px;border-top:1px solid #ddd;font-size:12.5px;">
          <b>สถานะการอนุมัติ:</b> ${statusBadge(t.Status)} &nbsp;
          ${t.ApproverName || t.ApproverEmail ? 'โดย '+esc(t.ApproverName||t.ApproverEmail) : ''}
          ${t.ApprovedAt ? ' เมื่อ '+fmtDate(t.ApprovedAt) : ''}
          ${t.ApproverComment ? '<br><b>ความเห็น:</b> '+esc(t.ApproverComment) : ''}
        </div>` : ''}
      </div>
    </div>
  `;
}

/* ================= SALE PRINT VIEW ================= */
function renderSalePrint(root){
  root.innerHTML = `<div class="empty">กำลังโหลด...</div>`;

    if(btn) btn.onclick = ()=> window.print();

}

          ${s.ApproverName || s.ApproverEmail ? 'โดย '+esc(s.ApproverName||s.ApproverEmail) : ''}
          ${s.ApprovedAt ? ' เมื่อ '+fmtDate(s.ApprovedAt) : ''}
          ${s.ApproverComment ? '<br><b>ความเห็น:</b> '+esc(s.ApproverComment) : ''}
        </div>` : ''}

}

/* ================= WRITE-OFF PRINT VIEW ================= */
function renderWriteOffPrint(root){
  root.innerHTML = `<div class="empty">กำลังโหลด...</div>`;
  apiGet({action:'getWriteOff', id: STATE.printWriteOffId}).then(res=>{
    if(!res.ok || !res.data){ root.innerHTML = '<div class="empty">ไม่พบใบตัดชำรุดนี้</div>'; return; }
    root.innerHTML = buildWriteOffDocHtml(res.data, true);
    const btn = document.getElementById('btnPrintWoNow');
    if(btn) btn.onclick = ()=> window.print();
  });
}

function buildWriteOffDocHtml(w, withToolbar){
  const itemsRows = (w.Items||[]).map((it, i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${docImgGallery(it.Images)}</td>
      <td>${esc(it.AssetID)}</td>
      <td class="left">${esc(it.AssetName)}</td>
      <td class="money">${fmtMoneyOrHidden(it.ScrapPrice)}</td>
      <td>${esc(it.Remark)}</td>
    </tr>`).join('');
  const total = (w.Items||[]).reduce((sum,it)=> sum + (parseFloat(it.ScrapPrice)||0), 0);

  return `
    ${withToolbar ? `
    <div class="toolbar no-print">
      <button class="btn btn-secondary btn-sm" onclick="STATE.view='writeOffList';render();">← กลับรายการ</button>
      <button class="btn btn-primary btn-sm" id="btnPrintWoNow">🖨️ พิมพ์ / บันทึก PDF</button>
      <span style="margin-left:auto;">${statusBadge(w.Status)}</span>
    </div>` : ''}
    <div class="card" id="printArea">
      <div class="doc">
        <div class="doc-header">${esc(COMPANY_NAME)}</div>
        <div class="doc-title">ใบตัดชำรุดทรัพย์สิน</div>
        <div class="doc-meta">
          <div><b>เลขที่</b> ${esc(w.RunningNo)}</div>
          <div><b>วันที่</b> ${fmtDate(w.CreatedAt)}</div>
        </div>
        <div class="doc-field"><b>หน่วยงาน</b> ${esc(w.FromDept)}</div>
        <div class="doc-field"><b>สาเหตุชำรุด</b> ${esc(w.Reason||'-')}</div>
        <div class="doc-field"><b>หมายเหตุ</b> ${esc(w.Remark||'-')}</div>

        <table class="doc-table">
          <tr><th style="width:6%;">ลำดับ</th><th style="width:16%;">รูปภาพ</th><th style="width:12%;">รหัส</th><th style="width:30%;">รายการ</th><th style="width:16%;">ราคาซาก</th><th style="width:20%;">หมายเหตุ</th></tr>
          ${itemsRows}
          <tr><td colspan="4" style="text-align:right;font-weight:600;">รวมราคาซาก</td><td style="font-weight:700;">${fmtMoney(total)}</td><td></td></tr>
        </table>

        <div class="doc-sign">
          <div>
            <div class="line"></div>
            (ผู้บันทึก) ${esc(w.CreatedBy||'')}<br>
            วันที่ <span class="dateline"></span>
          </div>
          <div>
            <div class="line"></div>
            (ผู้อนุมัติ) ${esc(w.ApproverName||'')}<br>
            วันที่ <span class="dateline"></span>
          </div>
        </div>

        ${w.Status !== 'Draft' ? `
        <div style="margin-top:20px;padding-top:14px;border-top:1px solid #ddd;font-size:12.5px;">
          <b>สถานะการอนุมัติ:</b> ${statusBadge(w.Status)} &nbsp;
          ${w.ApproverName || w.ApproverEmail ? 'โดย '+esc(w.ApproverName||w.ApproverEmail) : ''}
          ${w.ApprovedAt ? ' เมื่อ '+fmtDate(w.ApprovedAt) : ''}
          ${w.ApproverComment ? '<br><b>ความเห็น:</b> '+esc(w.ApproverComment) : ''}
        </div>` : ''}
      </div>
    </div>
  `;
}

/* ================= APPROVAL VIEW (from email link) ================= */
function renderApprove(){
  hideAppChrome();
  const root = document.getElementById('viewRoot');
  root.innerHTML = '<div class="empty">กำลังโหลดใบโอนย้าย...</div>';
  apiGet({action:'getApprovalView', id: STATE.approveCtx.id, token: STATE.approveCtx.token}).then(res=>{
    if(!res.ok){ root.innerHTML = `<div class="card"><div class="empty">${esc(res.error)}</div></div>`; return; }
    const t = res.data;
    STATE.currentTransfer = t;
    let actionHtml = '';
    if(t.Status === 'PendingApproval'){
      actionHtml = `
        <div class="card no-print">
          <h2>พิจารณาอนุมัติ</h2>
          <label>ความเห็น (ถ้ามี)</label>
          <textarea id="approveComment" placeholder="ระบุความเห็นเพิ่มเติม..."></textarea>
          <div style="margin-top:14px;display:flex;gap:10px;">
            <button class="btn btn-green" id="btnApprove">✓ อนุมัติ</button>
            <button class="btn btn-red" id="btnReject">✕ ไม่อนุมัติ</button>
          </div>
        </div>`;
    } else {
      actionHtml = `<div class="card"><div class="empty">รายการนี้ถูกดำเนินการแล้ว: ${statusBadge(t.Status)}</div></div>`;
    }
    root.innerHTML = buildDocHtml(t, false) + actionHtml;

    if(t.Status === 'PendingApproval'){
      document.getElementById('btnApprove').onclick = ()=>decide('Approved');
      document.getElementById('btnReject').onclick = ()=>decide('Rejected');
    }
  });

  function decide(decision){
    const comment = document.getElementById('approveComment').value;
    if(!confirm(decision==='Approved' ? 'ยืนยันการอนุมัติใบโอนย้ายนี้?' : 'ยืนยันการไม่อนุมัติใบโอนย้ายนี้?')) return;
    apiPost({ action:'decideTransfer', transferId: STATE.approveCtx.id, token: STATE.approveCtx.token, decision, comment })
      .then(res=>{
        if(!res.ok){ toast(res.error||'ดำเนินการไม่สำเร็จ','err'); return; }
        toast('บันทึกผลการพิจารณาเรียบร้อย','ok');
        renderApprove();
      });
  }
}
