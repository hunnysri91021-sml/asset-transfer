<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบโอนย้ายทรัพย์สิน — SML</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a3c6e; --navy-dark:#122a4d; --navy-light:#eaf0f8;
    --gold:#b8892f; --green:#1a7d3c; --red:#c0392b; --amber:#b8860b;
    --bg:#f4f6f9; --card:#ffffff; --border:#dde3ec; --text:#22303f; --muted:#697586;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);margin:0;}

  /* ===== APP SHELL / SIDEBAR LAYOUT ===== */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:99;}
  .sidebar-backdrop.open{display:block;}
  .sidebar{width:230px;flex:0 0 230px;background:var(--navy-dark);color:#fff;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:transform .2s ease;}
  .sidebar-brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .sidebar-brand h1{font-size:15px;margin:0;font-weight:700;line-height:1.35;}
  .sidebar-brand .sub{font-size:11px;opacity:.65;margin-top:5px;font-weight:300;line-height:1.4;}
  .sidebar-nav{padding:10px 0 24px;}
  .sidebar-nav .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.42);padding:16px 18px 6px;}
  .sidebar-nav button{display:block;width:100%;background:none;border:none;border-right:3px solid transparent;color:rgba(255,255,255,.82);padding:10px 18px;text-align:left;cursor:pointer;font-family:inherit;font-size:13.5px;transition:.15s;}
  .sidebar-nav button:hover{background:rgba(255,255,255,.08);}
  .sidebar-nav button.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;border-right-color:var(--gold);}
  .main-area{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0;}
  .topheader{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
  .topheader .page-title{font-size:16px;font-weight:600;color:var(--navy);}
  .sidebar-toggle{display:none;background:none;border:1px solid var(--border);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:16px;line-height:1;color:var(--navy);}
  .content{padding:20px 24px;max-width:1240px;width:100%;margin:0 auto;}
  @media (max-width: 880px){
    .sidebar{transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.25);}
    .sidebar.open{transform:translateX(0);}
    .main-area{margin-left:0;}
    .sidebar-toggle{display:inline-block;}
  }
  @media print{
    .sidebar, .topheader, .sidebar-backdrop{display:none !important;}
    .main-area{margin-left:0;}
  }

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,50,.05);}
  .card h2{margin-top:0;font-size:16px;color:var(--navy);border-bottom:2px solid var(--navy-light);padding-bottom:10px;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500;}
  input[type=text], input[type=date], input[type=email], select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:#fff;
  }
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:200px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-secondary{background:#eef1f6;color:var(--text);}
  .btn-secondary:hover{background:#e0e5ec;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:middle;}
  th{background:var(--navy-light);color:var(--navy);font-weight:600;}
  tbody tr:hover td{background:#f5f8fc;}
  .money{text-align:right;font-variant-numeric:tabular-nums;}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee;}
  .thumb-lg{width:100px;height:100px;object-fit:cover;border-radius:8px;background:#eee;border:1px solid var(--border);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge-pending{background:#fff3cd;color:var(--amber);}
  .badge-approved{background:#d4edda;color:var(--green);}
  .badge-rejected{background:#f8d7da;color:var(--red);}
  .badge-draft{background:#e2e3e5;color:#555;}
  .stat-tile{background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:14px 16px;flex:1;min-width:160px;}
  .stat-tile .num{font-size:26px;font-weight:700;color:var(--navy);}
  .stat-tile .label{font-size:13px;color:var(--muted);}
  .stat-tile .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:240px;overflow:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .autocomplete-item{padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;}
  .autocomplete-item:hover{background:var(--navy-light);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy-dark);color:#fff;padding:12px 20px;border-radius:8px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .toast.err{background:var(--red);}
  .toast.ok{background:var(--green);}
  .empty{text-align:center;color:var(--muted);padding:40px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .item-line{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafbfc;position:relative;}
  .item-line .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;}
  .file-drop{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;}
  .file-drop:hover{border-color:var(--navy);}

  /* ===== PRINT / DOCUMENT LAYOUT (matches original ใบโอนย้ายทรัพย์สิน template) ===== */
  .doc{background:#fff;padding:28px 34px;font-size:14px;line-height:1.6;}
  .doc .doc-header{text-align:center;font-weight:700;font-size:18px;margin-bottom:2px;}
  .doc .doc-title{text-align:center;font-weight:700;font-size:17px;margin:10px 0 16px;text-decoration:underline;}
  .doc .doc-meta{display:flex;justify-content:flex-end;gap:24px;font-size:13px;margin-bottom:10px;}
  .doc .doc-field{margin:4px 0;font-size:13.5px;}
  .doc .doc-field b{display:inline-block;min-width:70px;}
  .doc table.doc-table{margin-top:14px;font-size:12.5px;}
  .doc table.doc-table th{background:var(--navy-light);text-align:center;}
  .doc table.doc-table td{text-align:center;}
  .doc table.doc-table td.left{text-align:left;}
  .doc .doc-note{font-size:11.5px;color:#555;margin-top:16px;border-top:1px dashed #ccc;padding-top:10px;}
  .doc .doc-sign{display:flex;justify-content:space-between;margin-top:30px;font-size:13px;}
  .doc .doc-sign div{width:45%;text-align:center;}
  .doc .doc-sign .line{border-bottom:1px dotted #333;height:40px;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop no-print" id="sidebarBackdrop"></div>
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-brand">
      <h1>ระบบจัดการทรัพย์สิน</h1>
      <div class="sub">บริษัท สยามกลการโลจิสติกส์ จำกัด</div>
    </div>
    <nav id="mainNav" class="sidebar-nav">
      <div class="nav-group-label">ภาพรวม</div>
      <button data-view="dashboard">ข้อมูลรวม</button>
      <button data-view="assetList">รายการทรัพย์สิน</button>
      <div class="nav-group-label">โอนย้าย</div>
      <button data-view="list">รายการใบโอนย้าย</button>
      <button data-view="create">+ สร้างใบโอนย้าย</button>
      <div class="nav-group-label">ขายออก</div>
      <button data-view="saleList">รายการขายออก</button>
      <button data-view="saleCreate">+ บันทึกขายออก</button>
      <div class="nav-group-label">ตัดชำรุด</div>
      <button data-view="writeOffList">รายการตัดชำรุด</button>
      <button data-view="writeOffCreate">+ บันทึกตัดชำรุด</button>
      <div class="nav-group-label">ระบบ</div>
      <button data-view="settings">ตั้งค่า</button>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topheader no-print">
      <button class="sidebar-toggle" id="btnSidebarToggle">☰</button>
      <span class="page-title" id="pageTitle">ข้อมูลรวม</span>
    </header>
    <div id="viewRoot" class="content"></div>
  </div>
</div>
<div id="toastHost"></div>

<script>
/* ================= CONFIG ================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyiAvjkIoyvuWJ8eCyMho01tENIUR--1HjMEzOigVQn-IVevZido9dXKcmUSdPbXQjIxw/exec';
const COMPANY_NAME = '    บริษัท   สยามกลการโลจิสติกส์   จำกัด';

/* ================= STATE ================= */
let STATE = {
  view: 'dashboard',
  assets: [],
  deptCodes: [],
  transfers: [],
  currentTransfer: null,
  draftItems: [],
  approveCtx: null,
  adminPassword: null,
  adminAssets: [],
  sales: [],
  draftSaleItems: [],
  printSaleId: null,
  approveSaleCtx: null,
  assetsFull: [],
  selectedAssetIds: [],
  writeOffs: [],
  draftWriteOffItems: [],
  printWriteOffId: null,
  approveWriteOffCtx: null
};

/* ================= API HELPERS ================= */
function apiGet(params){
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  return fetch(url, { method:'GET' })
    .then(r => r.json())
    .catch(err => ({ ok:false, error:'เชื่อมต่อ GAS ไม่สำเร็จ: '+err }));
}
function apiPost(payload){
  return fetch(GAS_URL, {
    method:'POST',
    body: JSON.stringify(payload) // text/plain by default -> avoids CORS preflight on GAS
  }).then(r => r.json())
    .catch(err => ({ ok:false, error:'เชื่อมต่อ GAS ไม่สำเร็จ: '+err }));
}

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.getElementById('toastHost').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function fmtMoney(n){
  n = parseFloat(String(n).replace(/,/g,'')) || 0;
  return n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  const buddhistYear = dt.getFullYear()+543;
  return ('0'+dt.getDate()).slice(-2)+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+buddhistYear;
}
function statusBadge(s){
  const map = {
    Draft: ['draft','ฉบับร่าง'],
    PendingApproval: ['pending','รออนุมัติ'],
    Approved: ['approved','อนุมัติแล้ว'],
    Rejected: ['rejected','ไม่อนุมัติ'],
    Voided: ['draft','ยกเลิกแล้ว']
  };
  const v = map[s] || ['draft', s];
  return '<span class="badge badge-'+v[0]+'">'+v[1]+'</span>';
}
function assetStatusBadge(s){
  const map = {
    Active: ['approved','ใช้งาน'],
    Sold: ['rejected','ขายแล้ว'],
    WrittenOff: ['draft','ตัดชำรุด']
  };
  const v = map[s] || ['approved', 'ใช้งาน'];
  return '<span class="badge badge-'+v[0]+'">'+v[1]+'</span>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ================= ROUTER ================= */
function route(){
  const params = new URLSearchParams(location.search);
  if(params.get('view') === 'approve'){
    STATE.view = 'approve';
    STATE.approveCtx = { id: params.get('id'), token: params.get('token') };
    renderApprove();
    return;
  }
  if(params.get('view') === 'approveSale'){
    STATE.view = 'approveSale';
    STATE.approveSaleCtx = { id: params.get('id'), token: params.get('token') };
    renderApproveSale();
    return;
  }
  if(params.get('view') === 'approveWriteOff'){
    STATE.view = 'approveWriteOff';
    STATE.approveWriteOffCtx = { id: params.get('id'), token: params.get('token') };
    renderApproveWriteOff();
    return;
  }
  render();
}

const VIEW_TITLES = {
  dashboard: 'ข้อมูลรวม',
  assetList: 'รายการทรัพย์สิน',
  list: 'รายการใบโอนย้าย',
  create: 'สร้างใบโอนย้าย',
  print: 'ใบโอนย้ายทรัพย์สิน',
  saleList: 'รายการขายออก',
  saleCreate: 'บันทึกขายออก',
  salePrint: 'ใบขายออกทรัพย์สิน',
  writeOffList: 'รายการตัดชำรุด',
  writeOffCreate: 'บันทึกตัดชำรุด',
  writeOffPrint: 'ใบตัดชำรุดทรัพย์สิน',
  settings: 'ตั้งค่า'
};

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('btnSidebarToggle').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
};
document.getElementById('sidebarBackdrop').onclick = closeSidebar;

function showAppChrome(){
  document.getElementById('sidebar').style.display = '';
  document.querySelector('.topheader').style.display = '';
  document.querySelector('.main-area').style.marginLeft = '';
}
function hideAppChrome(){
  document.getElementById('sidebar').style.display = 'none';
  document.querySelector('.topheader').style.display = 'none';
  document.querySelector('.main-area').style.marginLeft = '0';
}

document.getElementById('mainNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(btn){
    STATE.view = btn.dataset.view;
    closeSidebar();
    render();
  }
});

function render(){
  showAppChrome();
  const root = document.getElementById('viewRoot');
  const titleEl = document.getElementById('pageTitle');
  if(titleEl) titleEl.textContent = VIEW_TITLES[STATE.view] || '';
  [...document.querySelectorAll('#mainNav button')].forEach(b=>b.classList.toggle('active', b.dataset.view===STATE.view));

  if(STATE.view === 'assetList') renderAssetList(root);
  else if(STATE.view === 'dashboard') renderDashboard(root);
  else if(STATE.view === 'list') renderList(root);
  else if(STATE.view === 'create') renderCreate(root);
  else if(STATE.view === 'saleList') renderSaleList(root);
  else if(STATE.view === 'saleCreate') renderSaleCreate(root);
  else if(STATE.view === 'salePrint') renderSalePrint(root);
  else if(STATE.view === 'writeOffList') renderWriteOffList(root);
  else if(STATE.view === 'writeOffCreate') renderWriteOffCreate(root);
  else if(STATE.view === 'writeOffPrint') renderWriteOffPrint(root);
  else if(STATE.view === 'settings') renderSettings(root);
  else if(STATE.view === 'print') renderPrint(root);
}

/* ================= ASSET LIST VIEW (browse, select, and act on assets) ================= */
const ASSET_TAGS = ['ใช้งาน', 'ชำรุด', 'ขาย', 'เก็บไว้ใช้', 'รอเปลี่ยนอะไหล่'];

function renderAssetList(root){
  root.innerHTML = `
    <div class="card">
      <h2>รายการทรัพย์สิน</h2>
      <div class="toolbar no-print">
        <input type="text" id="alSearch" placeholder="ค้นหารหัส / ชื่อทรัพย์สิน..." style="max-width:220px;">
        <select id="alStatus" style="max-width:160px;">
          <option value="">ทุกสถานะ</option>
          <option value="Active">ใช้งาน</option>
          <option value="Sold">ขายแล้ว</option>
          <option value="WrittenOff">ตัดชำรุด</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="btnAlFilter">กรอง</button>
        <button class="btn btn-secondary btn-sm" id="btnAlRefresh">↻ รีเฟรช</button>
      </div>
      <div class="toolbar no-print" style="border-top:1px solid var(--border);padding-top:10px;">
        <span id="alSelCount" style="font-size:13px;color:var(--muted);">เลือกไว้ 0 รายการ</span>
        <button class="btn btn-primary btn-sm" id="btnAlTransfer">สร้างใบโอนย้าย</button>
        <button class="btn btn-primary btn-sm" id="btnAlSale">สร้างใบขาย</button>
        <button class="btn btn-primary btn-sm" id="btnAlWriteOff">สร้างใบตัดชำรุด</button>
        <button class="btn btn-secondary btn-sm" id="btnAlRestore">คืนสถานะใช้งาน (Admin)</button>
      </div>
      <div id="alTableHost" style="margin-top:12px;"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;

  document.getElementById('btnAlFilter').onclick = load;
  document.getElementById('btnAlRefresh').onclick = load;
  document.getElementById('btnAlTransfer').onclick = ()=> startFromSelection('create');
  document.getElementById('btnAlSale').onclick = ()=> startFromSelection('saleCreate');
  document.getElementById('btnAlWriteOff').onclick = ()=> startFromSelection('writeOffCreate');
  document.getElementById('btnAlRestore').onclick = restoreSelected;

  load();

  function load(){
    const q = document.getElementById('alSearch').value.trim();
    const params = { action:'getAssetsFull' };
    if(q) params.q = q;
    document.getElementById('alTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet(params).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.assetsFull = res.data;
      STATE.selectedAssetIds = [];
      renderTable();
    });
  }

  function renderTable(){
    const host = document.getElementById('alTableHost');
    const statusFilter = document.getElementById('alStatus').value;
    let rows = STATE.assetsFull;
    if(statusFilter) rows = rows.filter(a => (a.AssetStatus||'Active') === statusFilter);
    if(!rows.length){ host.innerHTML = '<div class="empty">ไม่พบทรัพย์สิน</div>'; updateSelCount(); return; }
    let html = '<div style="overflow-x:auto;"><table><tr><th class="no-print"><input type="checkbox" id="alSelectAll"></th><th>รูป</th><th>รหัส</th><th>ชื่อทรัพย์สิน</th><th>หน่วยงาน</th><th>ผู้ดูแล</th><th>สถานที่</th><th>ราคาซื้อ</th><th>มูลค่าตามบัญชี</th><th>สถานะ</th><th>แท็กสถานะ</th></tr>';
    rows.forEach(a=>{
      const checked = STATE.selectedAssetIds.indexOf(a.AssetID)!==-1 ? 'checked' : '';
      const curTag = a.Tag || 'ใช้งาน';
      html += `<tr>
        <td class="no-print"><input type="checkbox" class="alRowChk" data-id="${esc(a.AssetID)}" ${checked}></td>
        <td><img class="thumb" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'"></td>
        <td><b>${esc(a.AssetID)}</b></td>
        <td>${esc(a.AssetName)}</td>
        <td>${esc(a.Department)}</td>
        <td>${esc(a.Custodian||'-')}</td>
        <td>${esc(a.Location||'-')}</td>
        <td class="money">${fmtMoney(a.PurchasePrice)}</td>
        <td class="money">${fmtMoney(a.BookValue)}</td>
        <td>${assetStatusBadge(a.AssetStatus)}</td>
        <td class="no-print"><select class="alTagSelect" data-id="${esc(a.AssetID)}" style="min-width:130px;">${ASSET_TAGS.map(t=>`<option value="${esc(t)}" ${curTag===t?'selected':''}>${esc(t)}</option>`).join('')}</select></td>
      </tr>`;
    });
    html += '</table></div>';
    host.innerHTML = html;

    document.getElementById('alSelectAll').onchange = (e)=>{
      const ids = rows.map(a=>a.AssetID);
      if(e.target.checked){
        ids.forEach(id=>{ if(STATE.selectedAssetIds.indexOf(id)===-1) STATE.selectedAssetIds.push(id); });
      } else {
        STATE.selectedAssetIds = STATE.selectedAssetIds.filter(id=>ids.indexOf(id)===-1);
      }
      renderTable();
    };
    host.querySelectorAll('.alRowChk').forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.id;
        if(chk.checked){
          if(STATE.selectedAssetIds.indexOf(id)===-1) STATE.selectedAssetIds.push(id);
        } else {
          STATE.selectedAssetIds = STATE.selectedAssetIds.filter(x=>x!==id);
        }
        updateSelCount();
      };
    });
    host.querySelectorAll('.alTagSelect').forEach(sel=>{
      sel.onchange = ()=> updateTag(sel.dataset.id, sel.value);
    });
    updateSelCount();
  }

  function updateTag(assetId, newTag){
    const apply = (pw)=>{
      apiPost({ action:'adminSaveAsset', password: pw, asset:{ AssetID: assetId, Tag: newTag } }).then(res=>{
        if(!res.ok){
          toast(res.error||'บันทึกแท็กสถานะไม่สำเร็จ','err');
          if(String(res.error||'').indexOf('รหัสผ่าน')!==-1) STATE.adminPassword = null;
          load();
          return;
        }
        STATE.adminPassword = pw;
        const a = STATE.assetsFull.find(x=>x.AssetID===assetId);
        if(a) a.Tag = newTag;
        toast('บันทึกแท็กสถานะสำเร็จ','ok');
      });
    };
    if(STATE.adminPassword){ apply(STATE.adminPassword); return; }
    const pw = prompt('กรอกรหัสผ่าน Admin เพื่อแก้ไขแท็กสถานะ');
    if(!pw){ load(); return; }
    apply(pw);
  }

  function updateSelCount(){
    document.getElementById('alSelCount').textContent = 'เลือกไว้ '+STATE.selectedAssetIds.length+' รายการ';
  }

  function selectedAssetObjs(){
    return STATE.assetsFull.filter(a => STATE.selectedAssetIds.indexOf(a.AssetID)!==-1);
  }

  function startFromSelection(targetView){
    const selected = selectedAssetObjs();
    if(!selected.length){ toast('กรุณาเลือกทรัพย์สินอย่างน้อย 1 รายการ','err'); return; }
    const disposed = selected.filter(a => (a.AssetStatus||'Active') !== 'Active');
    if(disposed.length){ toast('มีรายการที่ขาย/ตัดชำรุดไปแล้ว กรุณาเลือกเฉพาะทรัพย์สินที่ใช้งานอยู่','err'); return; }

    if(targetView === 'create'){
      STATE.draftItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, imageUrl: a.DisplayImage||'',
        remark: '', fromDeptName:'', toDeptName:'', fromSignName:'', toSignName:''
      }));
    } else if(targetView === 'saleCreate'){
      STATE.draftSaleItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, imageUrl: a.DisplayImage||'',
        scrapPrice:'', auctionPrice:'', salePrice:'', remark:''
      }));
    } else if(targetView === 'writeOffCreate'){
      STATE.draftWriteOffItems = selected.map(a => ({
        assetId: a.AssetID, assetName: a.AssetName, imageUrl: a.DisplayImage||'',
        scrapPrice:'', remark:''
      }));
    }
    STATE.view = targetView;
    render();
  }

  function restoreSelected(){
    const selected = selectedAssetObjs().filter(a => (a.AssetStatus||'Active') !== 'Active');
    if(!selected.length){ toast('กรุณาเลือกทรัพย์สินที่มีสถานะขายแล้ว/ตัดชำรุด','err'); return; }
    const pw = prompt('กรอกรหัสผ่าน Admin เพื่อคืนสถานะใช้งาน ('+selected.length+' รายการ)');
    if(!pw) return;
    if(!confirm('ยืนยันคืนสถานะใช้งานทรัพย์สิน '+selected.length+' รายการ?')) return;
    let done = 0, failed = 0;
    const next = ()=>{
      if(done+failed >= selected.length){
        toast('คืนสถานะสำเร็จ '+done+' รายการ'+(failed?(' ผิดพลาด '+failed+' รายการ'):''), failed? 'err':'ok');
        load();
        return;
      }
      const a = selected[done+failed];
      apiPost({action:'adminRestoreAsset', password: pw, assetId: a.AssetID}).then(res=>{
        if(res.ok) done++; else failed++;
        next();
      });
    };
    next();
  }
}

/* ================= DASHBOARD VIEW (ข้อมูลรวม) ================= */
function renderDashboard(root){
  root.innerHTML = `
    <div class="card">
      <h2>ข้อมูลรวมทรัพย์สิน</h2>
      <div id="dashHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;
  apiGet({action:'getAssetsFull'}).then(res=>{
    if(!res.ok){ document.getElementById('dashHost').innerHTML = 'โหลดไม่สำเร็จ: '+res.error; return; }
    renderDashboardContent(res.data);
  });

  function renderDashboardContent(assets){
    const statusLabels = { Active:'ใช้งาน', Sold:'ขายแล้ว', WrittenOff:'ตัดชำรุด' };
    const byStatus = {};
    assets.forEach(a=>{
      const st = a.AssetStatus || 'Active';
      if(!byStatus[st]) byStatus[st] = { count:0, purchase:0, book:0 };
      byStatus[st].count++;
      byStatus[st].purchase += parseFloat(a.PurchasePrice)||0;
      byStatus[st].book += parseFloat(a.BookValue)||0;
    });

    let tilesHtml = '<div class="row">';
    ['Active','Sold','WrittenOff'].forEach(st=>{
      const d = byStatus[st] || { count:0, purchase:0, book:0 };
      tilesHtml += `
        <div class="stat-tile">
          <div class="label">${statusLabels[st]}</div>
          <div class="num">${d.count}</div>
          <div class="sub">มูลค่าตามบัญชีรวม ${fmtMoney(d.book)} บาท</div>
        </div>`;
    });
    tilesHtml += `
      <div class="stat-tile">
        <div class="label">ทั้งหมด</div>
        <div class="num">${assets.length}</div>
        <div class="sub">ราคาซื้อรวม ${fmtMoney(assets.reduce((s,a)=>s+(parseFloat(a.PurchasePrice)||0),0))} บาท</div>
      </div>`;
    tilesHtml += '</div>';

    const byDept = {};
    assets.forEach(a=>{
      const d = a.Department || '-';
      if(!byDept[d]) byDept[d] = { count:0, purchase:0, book:0, active:0 };
      byDept[d].count++;
      byDept[d].purchase += parseFloat(a.PurchasePrice)||0;
      byDept[d].book += parseFloat(a.BookValue)||0;
      if((a.AssetStatus||'Active')==='Active') byDept[d].active++;
    });
    const deptRows = Object.keys(byDept).sort().map(d=>{
      const v = byDept[d];
      return `<tr><td>${esc(d)}</td><td style="text-align:center;">${v.count}</td><td style="text-align:center;">${v.active}</td><td class="money">${fmtMoney(v.purchase)}</td><td class="money">${fmtMoney(v.book)}</td></tr>`;
    }).join('');

    const byTag = {};
    assets.forEach(a=>{
      const t = a.Tag || 'ใช้งาน';
      byTag[t] = (byTag[t]||0) + 1;
    });
    const tagRows = ASSET_TAGS.map(t=>`<tr><td>${esc(t)}</td><td style="text-align:center;">${byTag[t]||0}</td></tr>`).join('');

    document.getElementById('dashHost').innerHTML = `
      ${tilesHtml}
      <div class="row" style="margin-top:24px;align-items:flex-start;">
        <div style="flex:2;min-width:280px;">
          <h2>สรุปแยกตามหน่วยงาน</h2>
          <div style="overflow-x:auto;">
            <table><tr><th>หน่วยงาน</th><th>จำนวนทั้งหมด</th><th>ใช้งานอยู่</th><th>ราคาซื้อรวม</th><th>มูลค่าตามบัญชีรวม</th></tr>
            ${deptRows || '<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>'}
            </table>
          </div>
        </div>
        <div style="flex:1;min-width:200px;">
          <h2>สรุปแยกตามแท็กสถานะ</h2>
          <table><tr><th>แท็กสถานะ</th><th>จำนวน</th></tr>${tagRows}</table>
        </div>
      </div>
    `;
  }
}

/* ================= LIST VIEW ================= */
function renderList(root){
  root.innerHTML = `
    <div class="card">
      <h2>รายการใบโอนย้ายทรัพย์สิน</h2>
      <div class="toolbar no-print">
        <input type="text" id="fSearch" placeholder="ค้นหาเลขที่ / เรื่อง..." style="max-width:220px;">
        <select id="fStatus" style="max-width:160px;">
          <option value="">ทุกสถานะ</option>
          <option value="PendingApproval">รออนุมัติ</option>
          <option value="Approved">อนุมัติแล้ว</option>
          <option value="Rejected">ไม่อนุมัติ</option>
        </select>
        <input type="date" id="fFrom" style="max-width:150px;">
        <input type="date" id="fTo" style="max-width:150px;">
        <button class="btn btn-secondary btn-sm" id="btnFilter">กรอง</button>
        <button class="btn btn-secondary btn-sm" id="btnRefresh">↻ รีเฟรช</button>
      </div>
      <div id="listTableHost"><div class="empty">กำลังโหลด...</div></div>
    </div>
  `;
  document.getElementById('btnFilter').onclick = loadList;
  document.getElementById('btnRefresh').onclick = loadList;
  loadList();

  function loadList(){
    const params = { action:'getTransfers' };
    const q = document.getElementById('fSearch').value.trim();
    const status = document.getElementById('fStatus').value;
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    if(q) params.q = q;
    if(status) params.status = status;
    if(from) params.from = from;
    if(to) params.to = to;
    document.getElementById('listTableHost').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    apiGet(params).then(res=>{
      if(!res.ok){ toast(res.error||'โหลดข้อมูลไม่สำเร็จ','err'); return; }
      STATE.transfers = res.data;
      renderListTable();
    });
  }
  function renderListTable(){
    const host = document.getElementById('listTableHost');
    if(!STATE.transfers.length){ host.innerHTML = '<div class="empty">ยังไม่มีใบโอนย้าย</div>'; return; }
    let html = '<table><tr><th>เลขที่</th><th>วันที่</th><th>เรื่อง</th><th>จาก → ไป</th><th>จำนวนรายการ</th><th>สถานะ</th><th>ผู้อนุมัติ</th><th class="no-print">การจัดการ</th></tr>';
    STATE.transfers.forEach(t=>{
      html += `<tr>
        <td><b>${esc(t.RunningNo)}</b></td>
        <td>${fmtDate(t.CreatedAt)}</td>
        <td>${esc(t.Subject==='อื่นๆ'?t.SubjectOther:t.Subject)}</td>
        <td>${esc(t.FromDept)} → ${esc(t.ToDept)}</td>
        <td style="text-align:center;">${t.ItemCount}</td>
        <td>${statusBadge(t.Status)}</td>
        <td>${esc(t.ApproverName||t.ApproverEmail||'-')}</td>
        <td class="no-print"><button class="btn btn-secondary btn-sm" onclick="openPrint('${t.TransferID}')">ดู/พิมพ์</button></td>
      </tr>`;
    });
    html += '</table>';
    host.innerHTML = html;
  }
}

window.openPrint = function(id){
  STATE.view = 'print';
  STATE.printId = id;
  render();
};

          <input type="text" id="cFromSign" placeholder="ชื่อ-นามสกุล ผู้โอน">
        </div>
        <div>
          <label>ชื่อผู้รับโอน (ตัวบรรจง)</label>
          <input type="text" id="cToSign" placeholder="ชื่อ-นามสกุล ผู้รับโอน">
        </div>
      </div>
      <div class="row">
        <div>
          <label>ชื่อผู้ขอ (ผู้บันทึกรายการ)</label>
          <input type="text" id="cCreatedBy">
        </div>
        <div>
          <label>อีเมลผู้ขอ (สำหรับรับผลอนุมัติ)</label>
          <input type="email" id="cCreatedByEmail">
        </div>
      </div>
      <div class="row">
        <div>
          <label>ชื่อผู้อนุมัติ (ผู้บริหาร)</label>
          <input type="text" id="cApproverName" placeholder="เช่น คุณสมชาย ผู้จัดการฝ่าย">
        </div>
        <div>
          <label>อีเมลผู้อนุมัติ *</label>
          <input type="email" id="cApproverEmail" placeholder="approver@company.com">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>รายการทรัพย์สินที่โอนย้าย</h2>
      <div class="autocomplete-wrap">
        <input type="text" id="assetSearch" placeholder="ค้นหารหัส หรือ ชื่อทรัพย์สิน แล้วเลือกเพื่อเพิ่มรายการ...">
        <div id="assetSuggest" class="autocomplete-list" style="display:none;"></div>
      </div>
      <div id="itemsHost" style="margin-top:14px;"></div>
      <div class="empty" id="itemsEmpty">ยังไม่มีรายการทรัพย์สิน — ค้นหาด้านบนเพื่อเพิ่ม</div>
    </div>

    <div class="card no-print" style="text-align:right;">
      <button class="btn btn-primary" id="btnSubmit">บันทึกและส่งอีเมลขออนุมัติ</button>
    </div>
  `;

  document.getElementById('cSubject').onchange = (e)=>{
    document.getElementById('cSubjectOtherWrap').style.display = e.target.value==='อื่นๆ' ? 'block':'none';
  };

  loadDeptOptions();
  loadAssetsForSearch();
  renderItems();

  document.getElementById('btnSubmit').onclick = submitTransfer;

  function loadDeptOptions(){
    apiGet({action:'getDeptCodes'}).then(res=>{
      if(!res.ok){ toast(res.error,'err'); return; }
      STATE.deptCodes = res.data;
      const opts = '<option value="">-- เลือก --</option>' + res.data.map(d=>`<option value="${esc(d.DeptName)}">${esc(d.DeptName)} (${esc(d.Code)})</option>`).join('');
      document.getElementById('cFromDept').innerHTML = opts;
      document.getElementById('cToDept').innerHTML = opts;
    });
  }

  function loadAssetsForSearch(){
    if(STATE.assets.length) return;
    apiGet({action:'getAssets'}).then(res=>{
      if(res.ok) STATE.assets = res.data;
    });
  }

  const searchInput = document.getElementById('assetSearch');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    const suggestBox = document.getElementById('assetSuggest');
    if(!q){ suggestBox.style.display='none'; return; }
    const matches = STATE.assets.filter(a =>
      String(a.AssetID).toLowerCase().includes(q) || String(a.AssetName).toLowerCase().includes(q)
    ).slice(0,15);
    if(!matches.length){ suggestBox.innerHTML = '<div class="autocomplete-item">ไม่พบรายการ</div>'; suggestBox.style.display='block'; return; }
    suggestBox.innerHTML = matches.map(a => `
      <div class="autocomplete-item" data-id="${esc(a.AssetID)}">
        <img class="thumb" src="${esc(a.DisplayImage||'')}" onerror="this.style.visibility='hidden'">
        <div><b>${esc(a.AssetID)}</b> — ${esc(a.AssetName)}<br><span style="color:var(--muted);font-size:11px;">${esc(a.Department)}</span></div>
      </div>`).join('');
    suggestBox.style.display='block';
    suggestBox.querySelectorAll('.autocomplete-item').forEach(el=>{
      el.onclick = ()=>{
        const asset = STATE.assets.find(a=>a.AssetID===el.dataset.id);
        addItem(asset);
        searchInput.value='';
        suggestBox.style.display='none';
      };
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.autocomplete-wrap')) {
      const box = document.getElementById('assetSuggest');
      if(box) box.style.display='none';
    }
  });

  function addItem(asset){
    STATE.draftItems.push({
      assetId: asset.AssetID,
      assetName: asset.AssetName,
      imageUrl: asset.DisplayImage || '',
      remark: '',
      fromDeptName: document.getElementById('cFromDept').value,
      toDeptName: document.getElementById('cToDept').value,
      fromSignName: document.getElementById('cFromSign').value,
      toSignName: document.getElementById('cToSign').value
    });
    renderItems();
  }

  function renderItems(){
    const host = document.getElementById('itemsHost');
    const empty = document.getElementById('itemsEmpty');
    empty.style.display = STATE.draftItems.length ? 'none':'block';
    host.innerHTML = STATE.draftItems.map((it, i) => `
      <div class="item-line">
        <button class="del" onclick="removeItem(${i})">✕</button>
        <div class="row">
          <div style="flex:0 0 90px;">
            <img class="thumb-lg" src="${esc(it.imageUrl||'')}" onerror="this.style.visibility='hidden'" id="itemImg${i}">
            <div class="file-drop" style="margin-top:6px;font-size:10px;" onclick="document.getElementById('itemFile${i}').click()">เปลี่ยนรูป</div>
            <input type="file" id="itemFile${i}" accept="image/*" style="display:none;" onchange="uploadItemImage(${i}, this)">
          </div>
          <div style="flex:2;">
            <b>${esc(it.assetId)}</b> — ${esc(it.assetName)}
            <label style="margin-top:6px;">หมายเหตุ</label>
            <input type="text" value="${esc(it.remark)}" onchange="updateItemField(${i},'remark',this.value)">
          </div>
        </div>
      </div>
    `).join('');
  }

  window.removeItem = (i)=>{ STATE.draftItems.splice(i,1); renderItems(); };
  window.updateItemField = (i, field, val)=>{ STATE.draftItems[i][field] = val; };
  window.uploadItemImage = (i, input)=>{
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      toast('กำลังอัปโหลดรูป...');
      apiPost({ action:'uploadImage', base64: reader.result, contentType: file.type, fileName: STATE.draftItems[i].assetId })
        .then(res=>{
          if(res.ok){
            STATE.draftItems[i].imageUrl = res.data.url;
            document.getElementById('itemImg'+i).src = res.data.url;
            toast('อัปโหลดรูปสำเร็จ','ok');
          } else toast(res.error||'อัปโหลดไม่สำเร็จ','err');
        });
    };
    reader.readAsDataURL(file);
  };

  function submitTransfer(){
    if(!STATE.draftItems.length){ toast('กรุณาเพิ่มรายการทรัพย์สินอย่างน้อย 1 รายการ','err'); return; }
    const approverEmail = document.getElementById('cApproverEmail').value.trim();
    if(!approverEmail){ toast('กรุณาระบุอีเมลผู้อนุมัติ','err'); return; }
    const fromDept = document.getElementById('cFromDept').value;
    const toDept = document.getElementById('cToDept').value;
    const fromSign = document.getElementById('cFromSign').value;
    const toSign = document.getElementById('cToSign').value;

    // sync per-item dept/signer with header selections in case changed after adding
    STATE.draftItems.forEach(it=>{
      it.fromDeptName = it.fromDeptName || fromDept;
      it.toDeptName = it.toDeptName || toDept;
      it.fromSignName = it.fromSignName || fromSign;
      it.toSignName = it.toSignName || toSign;
    });

    const payload = {
      action:'createTransfer',
      subject: document.getElementById('cSubject').value,
      subjectOther: document.getElementById('cSubjectOther').value,
      purpose: document.getElementById('cPurpose').value,
      fromDept, toDept,
      createdBy: document.getElementById('cCreatedBy').value,
      createdByEmail: document.getElementById('cCreatedByEmail').value,
      approverName: document.getElementById('cApproverName').value,
      approverEmail,
      items: STATE.draftItems
    };
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
    apiPost(payload).then(res=>{
      btn.disabled = false; btn.innerHTML = 'บันทึกและส่งอีเมลขออนุมัติ';
      if(!res.ok){ toast(res.error||'บันทึกไม่สำเร็จ','err'); return; }
      toast('สร้างใบโอนย้าย '+res.data.runningNo+' สำเร็จ ส่งอีเมลขออนุมัติแล้ว','ok');
      STATE.draftItems = [];
      STATE.view = 'print';
      STATE.printId = res.data.transferId;

    });

        </div>

    const fromDept = document.getElementById('sFromDept').value;

    const payload = {
      action:'createSale',

      buyer: document.getElementById('sBuyer').value,
      remark: document.getElementById('sRemark').value,
      createdBy: document.getElementById('sCreatedBy').value,

      btn.disabled = false; btn.innerHTML = 'บันทึกและส่งอีเมลขออนุมัติ';

      STATE.view = 'salePrint';
      STATE.printSaleId = res.data.saleId;
      render();
    });
  }

            <input type="text" value="${esc(it.remark)}" onchange="updateWoItemField(${i},'remark',this.value)">
          </div>
        </div>
      </div>
    `).join('');
  }

  window.removeWoItem = (i)=>{ STATE.draftWriteOffItems.splice(i,1); renderWoItems(); };
  window.updateWoItemField = (i, field, val)=>{ STATE.draftWriteOffItems[i][field] = val; };

  function submitWriteOff(){
    if(!STATE.draftWriteOffItems.length){ toast('กรุณาเพิ่มรายการทรัพย์สินอย่างน้อย 1 รายการ','err'); return; }
    const approverEmail = document.getElementById('wApproverEmail').value.trim();
    if(!approverEmail){ toast('กรุณาระบุอีเมลผู้อนุมัติ','err'); return; }
    const fromDept = document.getElementById('wFromDept').value;

    const payload = {
      action:'createWriteOff',
      fromDept,
      reason: document.getElementById('wReason').value,
      remark: document.getElementById('wRemark').value,
      createdBy: document.getElementById('wCreatedBy').value,
      createdByEmail: document.getElementById('wCreatedByEmail').value,
      approverName: document.getElementById('wApproverName').value,
      approverEmail,
      items: STATE.draftWriteOffItems
    };
    const btn = document.getElementById('btnSubmitWriteOff');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
    apiPost(payload).then(res=>{
      btn.disabled = false; btn.innerHTML = 'บันทึกและส่งอีเมลขออนุมัติ';
      if(!res.ok){ toast(res.error||'บันทึกไม่สำเร็จ','err'); return; }
      toast('สร้างใบตัดชำรุด '+res.data.runningNo+' สำเร็จ ส่งอีเมลขออนุมัติแล้ว','ok');
      STATE.draftWriteOffItems = [];
      STATE.view = 'writeOffPrint';
      STATE.printWriteOffId = res.data.writeOffId;
      render();
    });
  }
}

    ['PurchaseDate','วันที่ซื้อ'], ['PurchasePrice','ราคาซื้อ'], ['BookValue','มูลค่าตามบัญชี'],
    ['Custodian','ผู้ดูแล'], ['Location','สถานที่'], ['Tag','แท็กสถานะ'], ['ImageURL','URL รูปภาพ']

          <tbody id="adminAssetsBody"></tbody>
        </table>
      </div>
    `;
    document.getElementById('btnAdminRefresh').onclick = loadAdminAssets;
    document.getElementById('btnAdminAddNew').onclick = addBlankAssetRow;
    renderAdminRows();

    function addBlankAssetRow(){
      STATE.adminAssets.unshift({ AssetID:'', AssetName:'', Department:'', PurchaseDate:'', PurchasePrice:'', BookValue:'', Custodian:'', Location:'', ImageURL:'', __isNew:true });
      renderAdminRows();
    }

    function renderAdminRows(){
      const body = document.getElementById('adminAssetsBody');
      if(!STATE.adminAssets.length){ body.innerHTML = `<tr><td colspan="${ADMIN_FIELD_COLS.length+1}" class="empty">ยังไม่มีข้อมูลทรัพย์สิน</td></tr>`; return; }
      body.innerHTML = STATE.adminAssets.map((a, i) => `
        <tr>
          ${ADMIN_FIELD_COLS.map(([f])=> `<td><input type="text" data-field="${f}" data-i="${i}" value="${esc(a[f]!=null?a[f]:'')}" ${f==='AssetID' && !a.__isNew ? 'readonly style="background:#f4f6f9;"' : ''}></td>`).join('')}
          <td class="no-print" style="white-space:nowrap;">
            <button class="btn btn-green btn-sm" data-save="${i}">บันทึก</button>
            <button class="btn btn-red btn-sm" data-del="${i}" ${a.__isNew?'disabled':''}>ลบ</button>
          </td>
        </tr>
      `).join('');
      body.querySelectorAll('button[data-save]').forEach(b=>{ b.onclick = ()=> saveRow(parseInt(b.dataset.save,10)); });
      body.querySelectorAll('button[data-del]').forEach(b=>{ b.onclick = ()=> deleteRow(parseInt(b.dataset.del,10)); });
    }

    function collectRow(i){
      const obj = {};
      document.querySelectorAll(`input[data-i="${i}"]`).forEach(inp => { obj[inp.dataset.field] = inp.value.trim(); });
      return obj;
    }

    function saveRow(i){
      const asset = collectRow(i);
      if(!asset.AssetID){ toast('กรุณาระบุรหัสทรัพย์สิน (AssetID)','err'); return; }
      apiPost({ action:'adminSaveAsset', password: STATE.adminPassword, asset }).then(res=>{
        if(!res.ok){ toast(res.error||'บันทึกไม่สำเร็จ','err'); return; }
        toast('บันทึกข้อมูลสำเร็จ','ok');
        loadAdminAssets();
      });
    }

    function deleteRow(i){
      const asset = STATE.adminAssets[i];
      if(!confirm('ยืนยันการลบทรัพย์สิน '+asset.AssetID+' ?')) return;
      apiPost({ action:'adminDeleteAsset', password: STATE.adminPassword, assetId: asset.AssetID }).then(res=>{
        if(!res.ok){ toast(res.error||'ลบไม่สำเร็จ','err'); return; }
        toast('ลบข้อมูลสำเร็จ','ok');
        loadAdminAssets();
      });
    }
  }
}

    if(!res.ok || !res.data){ root.innerHTML = '<div class="empty">ไม่พบใบตัดชำรุดนี้</div>'; return; }
    root.innerHTML = buildWriteOffDocHtml(res.data, true);
    const btn = document.getElementById('btnPrintWoNow');
    if(btn) btn.onclick = ()=> window.print();
  });
}

function buildWriteOffDocHtml(w, withToolbar){
  const itemsRows = (w.Items||[]).map((it, i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${esc(it.AssetID)}</td>
      <td class="left">${it.ImageURL?`<img src="${esc(it.ImageURL)}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;">`:''} ${esc(it.AssetName)}</td>
      <td class="money">${fmtMoney(it.ScrapPrice)}</td>
      <td>${esc(it.Remark)}</td>
    </tr>`).join('');
  const total = (w.Items||[]).reduce((sum,it)=> sum + (parseFloat(it.ScrapPrice)||0), 0);

  return `
    ${withToolbar ? `
    <div class="toolbar no-print">
      <button class="btn btn-secondary btn-sm" onclick="STATE.view='writeOffList';render();">← กลับรายการ</button>
      <button class="btn btn-primary btn-sm" id="btnPrintWoNow">🖨️ พิมพ์ / บันทึก PDF</button>
      <span style="margin-left:auto;">${statusBadge(w.Status)}</span>
    </div>` : ''}
    <div class="card" id="printArea">
      <div class="doc">
        <div class="doc-header">${esc(COMPANY_NAME)}</div>
        <div class="doc-title">ใบตัดชำรุดทรัพย์สิน</div>
        <div class="doc-meta">
          <div><b>เลขที่</b> ${esc(w.RunningNo)}</div>
          <div><b>วันที่</b> ${fmtDate(w.CreatedAt)}</div>
        </div>
        <div class="doc-field"><b>หน่วยงาน</b> ${esc(w.FromDept)}</div>
        <div class="doc-field"><b>สาเหตุชำรุด</b> ${esc(w.Reason||'-')}</div>
        <div class="doc-field"><b>หมายเหตุ</b> ${esc(w.Remark||'-')}</div>

        <table class="doc-table">
          <tr><th style="width:30px;">ลำดับ</th><th style="width:90px;">รหัส</th><th>รายการ</th><th>ราคาซาก</th><th>หมายเหตุ</th></tr>
          ${itemsRows}
          <tr><td colspan="3" style="text-align:right;font-weight:600;">รวมราคาซาก</td><td style="font-weight:700;">${fmtMoney(total)}</td><td></td></tr>
        </table>

        <div class="doc-sign">
          <div>
            <div class="line"></div>
            (ผู้บันทึก) ${esc(w.CreatedBy||'')}<br>
            วันที่..........................
          </div>
          <div>
            <div class="line"></div>
            (ผู้อนุมัติ) ${esc(w.ApproverName||'')}<br>
            วันที่..........................
          </div>
        </div>

        ${w.Status !== 'Draft' ? `
        <div style="margin-top:20px;padding-top:14px;border-top:1px solid #ddd;font-size:12.5px;">
          <b>สถานะการอนุมัติ:</b> ${statusBadge(w.Status)} &nbsp;
          ${w.ApproverName || w.ApproverEmail ? 'โดย '+esc(w.ApproverName||w.ApproverEmail) : ''}
          ${w.ApprovedAt ? ' เมื่อ '+fmtDate(w.ApprovedAt) : ''}
          ${w.ApproverComment ? '<br><b>ความเห็น:</b> '+esc(w.ApproverComment) : ''}
        </div>` : ''}
      </div>
    </div>
  `;
}

/* ================= APPROVAL VIEW (from email link) ================= */
function renderApprove(){
  hideAppChrome();
  const root = document.getElementById('viewRoot');
  root.innerHTML = '<div class="empty">กำลังโหลดใบโอนย้าย...</div>';
  apiGet({action:'getApprovalView', id: STATE.approveCtx.id, token: STATE.approveCtx.token}).then(res=>{
    if(!res.ok){ root.innerHTML = `<div class="card"><div class="empty">${esc(res.error)}</div></div>`; return; }
    const t = res.data;
    STATE.currentTransfer = t;
    let actionHtml = '';
    if(t.Status === 'PendingApproval'){
      actionHtml = `
        <div class="card no-print">
          <h2>พิจารณาอนุมัติ</h2>
          <label>ความเห็น (ถ้ามี)</label>
          <textarea id="approveComment" placeholder="ระบุความเห็นเพิ่มเติม..."></textarea>
          <div style="margin-top:14px;display:flex;gap:10px;">
            <button class="btn btn-green" id="btnApprove">✓ อนุมัติ</button>
            <button class="btn btn-red" id="btnReject">✕ ไม่อนุมัติ</button>
          </div>
        </div>`;
    } else {
      actionHtml = `<div class="card"><div class="empty">รายการนี้ถูกดำเนินการแล้ว: ${statusBadge(t.Status)}</div></div>`;
    }
    root.innerHTML = buildDocHtml(t, false) + actionHtml;

    if(t.Status === 'PendingApproval'){
      document.getElementById('btnApprove').onclick = ()=>decide('Approved');
      document.getElementById('btnReject').onclick = ()=>decide('Rejected');
    }
  });

  function decide(decision){
    const comment = document.getElementById('approveComment').value;
    if(!confirm(decision==='Approved' ? 'ยืนยันการอนุมัติใบโอนย้ายนี้?' : 'ยืนยันการไม่อนุมัติใบโอนย้ายนี้?')) return;
    apiPost({ action:'decideTransfer', transferId: STATE.approveCtx.id, token: STATE.approveCtx.token, decision, comment })
      .then(res=>{
        if(!res.ok){ toast(res.error||'ดำเนินการไม่สำเร็จ','err'); return; }
        toast('บันทึกผลการพิจารณาเรียบร้อย','ok');
        renderApprove();
      });
  }
}
